{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- /*
  NO LONG-LIVED CREDENTIALS IN THE WORKER IMAGE.

  Every credential lives here and is injected at pod start via secretKeyRef.
  A credential baked into the image is readable by every job that image runs,
  including a build from a submitter who should never have had it, and it
  cannot be rotated without a rebuild and redeploy of every consumer.

  The webhook HMAC and the API token are separate keys and are consumed by
  separate Deployments. They authenticate different callers, so they rotate on
  different schedules and a leak of one does not imply the other.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loki-mode.secretName" . }}
  labels:
    {{- include "loki-mode.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Receiver only. Validates the GitHub HMAC-SHA256 signature. Empty means the
  # receiver rejects every webhook with 503 rather than accepting unsigned ones.
  github-webhook-secret: {{ .Values.secrets.githubWebhookSecret | quote }}

  # Receiver only. Bearer token for POST /jobs (remote submit). Empty means
  # /jobs is rejected with 503; it is never left unauthenticated.
  api-token: {{ .Values.secrets.apiToken | quote }}

  # RECEIVER ONLY, and the asymmetry is the security property. An Ed25519 PEM
  # that signs the attestation on each served receipt. The WORKER must never
  # hold this: a worker runs model-directed code, so a key there would let a
  # build sign its own receipt, and a self-attested receipt attests to nothing.
  # Empty means receipts are served UNSIGNED, which is a valid state with an
  # existing verdict -- never a silently-forged signature.
  receipt-signing-key: {{ .Values.secrets.receiptSigningKey | quote }}

  # Worker only. The receiver never runs a build, so it never gets this -- a
  # compromised receiver cannot spend your provider budget.
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}

  # Worker only. Used by builds for git push / PR creation.
  github-token: {{ .Values.secrets.githubToken | quote }}
{{- end }}
