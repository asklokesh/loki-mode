{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "loki-mode.serviceAccountName" . }}
  labels:
    {{- include "loki-mode.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# No RoleBinding: neither the receiver nor the worker calls the Kubernetes API.
# The account exists so the pods are not sharing `default`, and the token is not
# mounted (see serviceAccount.automountServiceAccountToken) so a build that goes
# wrong has no cluster credential to escalate with.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
