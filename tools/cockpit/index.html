<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loki Cockpit</title>
<style>
:root{
 --bg:#0d0f13;--bg-2:#12151b;--panel:#161a21;--panel-2:#1c212a;--line:#262c37;--line-2:#323a47;
 --ink:#eceef2;--ink-2:#b4bac6;--ink-3:#8b93a3;--accent:#6aa7f4;--accent-ink:#0b1424;
 --good:#3fb97a;--warn:#e0a33a;--bad:#ef6b6b;--unk:#8b93a3;--stale:#c58b3a;
 --good-bg:rgba(63,185,122,.13);--warn-bg:rgba(224,163,58,.14);--bad-bg:rgba(239,107,107,.14);--unk-bg:rgba(139,147,163,.14);
 --bar:#6aa7f4;--bar-2:#3a4659;--grid:#232935;
 --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);
 --r:10px;--r-s:6px;
 --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 --z-sticky:10;--z-backdrop:20;--z-drawer:30;--z-tip:50;
 color-scheme:dark;
}
:root[data-theme="light"]{
 --bg:#f6f7f9;--bg-2:#eef0f3;--panel:#ffffff;--panel-2:#f5f6f8;--line:#e3e6eb;--line-2:#d3d8df;
 --ink:#111318;--ink-2:#3d4350;--ink-3:#5e6573;--accent:#2a6fc9;--accent-ink:#ffffff;
 --good:#17804a;--warn:#9a6200;--bad:#c23434;--unk:#5e6573;--stale:#8f5a10;
 --good-bg:rgba(23,128,74,.10);--warn-bg:rgba(154,98,0,.10);--bad-bg:rgba(194,52,52,.09);--unk-bg:rgba(94,101,115,.10);
 --bar:#2a6fc9;--bar-2:#c5ccd6;--grid:#e8ebef;
 --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
 color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px}
h3{font-size:12.5px;color:var(--ink-2);font-weight:600;margin:14px 0 6px}
.num,.kv td:last-child,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.mute{color:var(--ink-3)}
.small{font-size:12px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* top bar */
.top{position:sticky;top:0;z-index:var(--z-sticky);display:flex;align-items:center;gap:18px;padding:10px 24px;
 background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:16px}
.mark{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 210deg,#6aa7f4,#b191ea,#21bfa0,#6aa7f4)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{color:var(--ink-2);text-decoration:none;padding:5px 9px;border-radius:6px;font-size:13px}
.nav a:hover{background:var(--panel-2);color:var(--ink)}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--unk);flex:none}
.live[data-mode="live"] .dot{background:var(--good);animation:ping 2.4s cubic-bezier(.16,1,.3,1) infinite}
.live[data-mode="polling"] .dot{background:var(--warn)}
.live[data-mode="offline"] .dot{background:var(--bad)}
.live[data-mode="degraded"] .dot{background:var(--warn)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(63,185,122,.55)}70%{box-shadow:0 0 0 7px rgba(63,185,122,0)}100%{box-shadow:0 0 0 0 rgba(63,185,122,0)}}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}

main{padding:18px 24px 60px;max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* pulse band */
.pulse{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow)}
.pulse[data-st="VIOLATION"]{background:linear-gradient(0deg,var(--bad-bg),var(--bad-bg)),var(--panel);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.pulse .lead{font-weight:600}
.pulse ol{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:12.5px}
.pulse ol li{margin:2px 0}
.pulse details summary{cursor:pointer;color:var(--ink-3);font-size:12.5px;margin-top:4px}

/* kpi strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;min-height:96px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:96px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow);position:relative}
.kpi .lab{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.kpi .val{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .sub{font-size:12px;color:var(--ink-2)}
.kpi[data-st="VIOLATION"] .val{color:var(--bad)}
.kpi[data-st="STALE"] .val{color:var(--warn)}
.kpi .val .nodata{font-size:12.5px;font-weight:400;letter-spacing:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.kpi,.panel,.pulse{overflow-wrap:break-word}
.nodata,.err,.warnline,.pulse li{overflow-wrap:anywhere}

/* panels */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph .asof{margin-left:auto;font-size:12px;color:var(--ink-3)}
.pb{padding:12px 16px 16px;min-height:120px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--unk-bg);color:var(--unk);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip[data-st="OK"],.chip[data-st="active"]{background:var(--good-bg);color:var(--good)}
.chip[data-st="PARTIAL"],.chip[data-st="STALE"],.chip[data-st="stale"],.chip[data-st="UNMEASURED"]{background:var(--warn-bg);color:var(--warn)}
.chip[data-st="VIOLATION"],.chip[data-st="failed"]{background:var(--bad-bg);color:var(--bad)}
.nodata{color:var(--ink-3);font-style:italic}
.err{color:var(--bad);font-size:12.5px;margin:6px 0}
.warnline{color:var(--warn);font-size:12.5px;margin:6px 0}
.skel{height:12px;border-radius:4px;background:linear-gradient(90deg,var(--panel-2),var(--line),var(--panel-2));background-size:200% 100%;animation:sh 1.4s linear infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
table{border-collapse:collapse;width:100%}
.kv td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.kv td:first-child{color:var(--ink-3);width:44%;padding-right:12px}
.tbl{font-size:12.5px}
.tbl th{text-align:left;color:var(--ink-3);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:hover td{background:var(--panel-2)}
.scroll{max-height:340px;overflow:auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.src{margin-top:12px;font-size:11.5px;color:var(--ink-3)}
.src summary{cursor:pointer}
.src li{margin:2px 0;word-break:break-word}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:10.5px;font-family:var(--font)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .b{fill:var(--bar)}
.chart .b2{fill:var(--bar-2)}
.chart .hit{fill:transparent}
.chart g:hover .b{filter:brightness(1.2)}
.hbar{display:grid;grid-template-columns:minmax(90px,auto) 1fr 56px;gap:6px 10px;align-items:center;font-size:12.5px}
.hbar .track{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.hbar .fill{display:block;height:100%;border-radius:4px;background:var(--bar);transition:width .25s cubic-bezier(.16,1,.3,1)}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.meter{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin:4px 0 2px}
.meter>i{display:block;height:100%;background:var(--bar);border-radius:4px}
.meter[data-st="VIOLATION"]>i{background:var(--bad)}
.meter[data-st="STALE"]>i{background:var(--warn)}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.seat{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;position:relative;transition:border-color .18s ease,transform .18s cubic-bezier(.16,1,.3,1)}
.seat:hover{border-color:color-mix(in srgb,var(--seat) 55%,var(--line));transform:translateY(-1px)}
.seat:focus-visible{outline:2px solid var(--seat);outline-offset:2px}
.seat .row{display:flex;gap:12px;align-items:center}
.av{width:84px;height:84px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--seat) 22%,transparent),transparent 70%),var(--panel);border:1px solid var(--line);overflow:hidden;position:relative}
.av canvas,.av svg{width:100%;height:100%;display:block}
.av[data-mood="active"]{box-shadow:0 0 0 1px color-mix(in srgb,var(--seat) 50%,transparent),0 0 18px color-mix(in srgb,var(--seat) 35%,transparent)}
.av[data-mood="stale"]{filter:saturate(.35) brightness(.8)}
.av[data-mood="failed"]{filter:saturate(.35);border-color:color-mix(in srgb,var(--bad) 60%,var(--line))}
.seat .nm{font-weight:600;font-size:14px;line-height:1.25}
.seat .rl{font-size:12px;color:var(--ink-3)}
.seat .ps{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.seat .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:8px}
.seat .stats b{display:block;color:var(--ink);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.swatch{width:8px;height:8px;border-radius:2px;background:var(--seat);display:inline-block;margin-right:6px;vertical-align:1px}
.spawned{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;background:var(--panel-2);border:1px dashed var(--line-2);border-radius:var(--r);padding:12px 14px}
.spawned b{font-size:15px}

/* drawer */
.backdrop{position:fixed;inset:0;background:rgba(5,7,10,.5);z-index:var(--z-backdrop);opacity:0;pointer-events:none;transition:opacity .2s ease}
.backdrop.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--bg-2);border-left:1px solid var(--line);z-index:var(--z-drawer);
 transform:translateX(102%);transition:transform .26s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;gap:16px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.dh .av{width:120px;height:120px}
.dh h2{font-size:19px}
.db{overflow:auto;padding:16px 22px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card>h3:first-child{margin-top:0}
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:16px 140px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.tl .ev i{width:9px;height:9px;border-radius:50%;margin-top:4px;background:var(--good)}
.tl .ev[data-k="skipped"] i{background:var(--unk)}
.tl .ev[data-k="error"] i{background:var(--bad)}
ul.plain{margin:4px 0;padding-left:18px}
ul.plain li{margin:3px 0;color:var(--ink-2)}

/* queue */
.qform{display:grid;gap:8px;max-width:820px;margin-top:12px}
.qform textarea,.qform input{width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px}
.qform textarea{min-height:76px;resize:vertical}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.55;cursor:progress}
.btn:hover:not(:disabled){filter:brightness(1.08)}

#tip{position:fixed;z-index:var(--z-tip);max-width:420px;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .12s ease;white-space:pre-wrap;word-break:break-word;left:0;top:0}
#tip.on{opacity:1}
[data-prov]{cursor:help}
@media (max-width:640px){.top{padding:10px 16px;flex-wrap:wrap}main{padding:14px 16px 40px}.grid2{grid-template-columns:1fr}.nav{display:none}.dh .av{width:84px;height:84px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Loki Cockpit</h1></div>
 <nav class="nav" aria-label="Sections">
  <a href="#team">Team</a><a href="#releases">Releases</a><a href="#work">Work</a><a href="#roi">ROI</a><a href="#compare">Compare</a><a href="#health">Health</a><a href="#queue">Founder queue</a>
 </nav>
 <span class="spacer"></span>
 <span class="live" id="live" data-mode="connecting" data-prov="Live updates: Server-Sent Events from /api/stream. On a change event the page refetches /api/snapshot. Without a stream it polls every 15 s."><span class="dot"></span><span id="livetxt">Connecting</span></span>
 <button class="iconbtn" id="theme" type="button" aria-label="Toggle light or dark theme">Light</button>
</header>
<main>
 <section class="pulse" id="p-pulse" aria-live="polite"><div class="skel" style="width:40%"></div></section>
 <section class="kpis" id="kpi" aria-label="Key numbers"></section>
 <section class="panel" id="team"><div class="ph"><h2>Team</h2><span class="chip" id="team-chip">loading</span><span class="asof" id="team-asof"></span></div><div class="pb" id="p-agents"><div class="skel"></div><div class="skel" style="width:70%"></div></div></section>
 <div class="grid2">
  <section class="panel" id="releases"><div class="ph"><h2>Releases</h2><span class="chip">loading</span><span class="asof"></span></div><div class="pb" id="p-releases"><div class="skel"></div></div></section>
  <section class="panel" id="work"><div class="ph"><h2>Work and board flow</h2><span class="chip">loading</span><span class="asof"></span></div><div class="pb" id="p-work"><div class="skel"></div></div></section>
  <section class="panel" id="boardp"><div class="ph"><h2>Board</h2><span class="chip">loading</span><span class="asof"></span></div><div class="pb" id="p-board"><div class="skel"></div></div></section>
  <section class="panel" id="roi"><div class="ph"><h2>ROI</h2><span class="chip">loading</span><span class="asof"></span></div><div class="pb" id="p-roi"><div class="skel"></div></div></section>
  <section class="panel" id="compare"><div class="ph"><h2>Comparisons</h2><span class="chip">loading</span><span class="asof"></span></div><div class="pb" id="p-compare"><div class="skel"></div></div></section>
  <section class="panel" id="health"><div class="ph"><h2>Health and usage</h2><span class="chip">loading</span><span class="asof"></span></div><div class="pb" id="p-health"><div class="skel"></div></div></section>
  <section class="panel" id="okrs"><div class="ph"><h2>OKRs</h2><span class="chip">loading</span><span class="asof"></span></div><div class="pb" id="p-okrs"><div class="skel"></div></div></section>
  <section class="panel" id="queue"><div class="ph"><h2>Founder command box</h2><span class="chip">loading</span><span class="asof"></span></div>
   <div class="pb"><div id="p-queue"><div class="skel"></div></div>
    <div class="qform">
     <label class="small mute" for="item">Command for the chief-of-staff (appended to docs/v10/FOUNDER-QUEUE.md)</label>
     <textarea id="item" maxlength="2000" placeholder="What should the company do next?"></textarea>
     <input id="why" maxlength="2000" placeholder="Why (optional)">
     <div style="display:flex;gap:12px;align-items:center"><button class="btn" id="send" type="button">Queue it</button><span class="small mute" id="count">0/2000</span><span class="small" id="qres" aria-live="polite"></span></div>
    </div>
   </div>
  </section>
 </div>
 <p class="small mute" id="fail" role="status"></p>
</main>
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dname" aria-hidden="true">
 <div class="dh" id="dhead"></div>
 <div class="db" id="dbody"></div>
</aside>
<div id="tip" role="tooltip"></div>
<script id="cockpit-main">
(function(){
"use strict";
var TOKEN="__COCKPIT_TOKEN__";
var W=typeof window!=="undefined"?window:{};
var TEST=!!W.__COCKPIT_TEST;
var PANEL_NAMES=["pulse","releases","board","agents","work","compare","health","okrs","roi","queue"];

/* null-safe DOM helpers: add() holds the only appendChild call in the page */
function isNode(x){return x!==null&&typeof x==="object"&&typeof x.nodeType==="number";}
function add(parent){
 if(!isNode(parent))return parent;
 for(var i=1;i<arguments.length;i++){
  var c=arguments[i];
  if(c===null||c===undefined||c===false||c==="")continue;
  if(Array.isArray(c)){for(var j=0;j<c.length;j++)add(parent,c[j]);continue;}
  if(!isNode(c))c=document.createTextNode(String(c));
  parent.appendChild(c);
 }
 return parent;
}
function attrs(el,a){if(!a)return el;Object.keys(a).forEach(function(k){var v=a[k];if(v===null||v===undefined||v===false)return;
 if(k==="text")el.textContent=String(v);
 else if(k==="style"&&typeof v==="object"){Object.keys(v).forEach(function(sk){var css=sk.indexOf("-")>=0?sk:sk.replace(/[A-Z]/g,function(m){return "-"+m.toLowerCase();});el.style.setProperty(css,v[sk]);});}
 else if(k.slice(0,2)==="on"&&typeof v==="function")el.addEventListener(k.slice(2),v);
 else el.setAttribute(k,String(v));});return el;}
function h(tag,a){var el=attrs(document.createElement(tag),a);add.apply(null,[el].concat(Array.prototype.slice.call(arguments,2)));return el;}
var SVGNS="http://www.w3.org/2000/svg";
function s(tag,a){var el=attrs(document.createElementNS(SVGNS,tag),a);add.apply(null,[el].concat(Array.prototype.slice.call(arguments,2)));return el;}
function clear(el){if(isNode(el))el.textContent="";return el;}
function byId(id){return document.getElementById(id);}

/* formatting */
function get(o,path){for(var i=0;i<path.length;i++){if(o===null||o===undefined||typeof o!=="object")return undefined;o=o[path[i]];}return o;}
function has(v){return v!==null&&v!==undefined&&!(typeof v==="number"&&isNaN(v));}
/* a seat file may hold a scalar where a list is expected: show it as one item, never call .map on it */
function arr(v){return Array.isArray(v)?v:(has(v)&&v!==""?[v]:[]);}
function nd(reason){var t="no data: "+(reason||"source did not report this value");return h("span",{"class":"nodata","title":t},t);}
function n(v,d){if(!has(v))return null;if(typeof v!=="number")return String(v);var x=d===undefined?(Math.abs(v)>=100?0:(Math.abs(v)>=10?1:2)):d;
 return v.toLocaleString("en-US",{maximumFractionDigits:x,minimumFractionDigits:0});}
function usd(v){if(!has(v)||typeof v!=="number")return null;return "$"+v.toLocaleString("en-US",{minimumFractionDigits:v<100?2:0,maximumFractionDigits:v<100?2:0});}
function pct(v){return has(v)?n(v,1)+"%":null;}
function or(v,reason){return has(v)?v:nd(reason);}
function ago(min){if(!has(min))return null;if(min<1)return "just now";if(min<60)return Math.round(min)+" min ago";if(min<2880)return n(min/60,1)+" h ago";return n(min/1440,1)+" d ago";}
function shortTs(ts){if(!ts)return null;var d=new Date(ts);if(isNaN(d))return String(ts);return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});}
