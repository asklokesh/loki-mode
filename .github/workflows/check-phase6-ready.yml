name: Phase 6 Readiness (weekly)

# Runs `bun loki-ts/scripts/check-phase6-ready.ts` weekly. Uploads the
# result as an artifact. If a precondition fails for the first time (no
# open issue with the `phase6-not-ready` label), opens a tracking issue.

on:
  # schedule:
  #   # Mondays at 08:00 UTC. Cron DISABLED; workflow_dispatch only.
  #   #
  #   # The original 2026-05-22 reason was "issues disabled on repo". That reason
  #   # is now STALE: issues are enabled again (REST has_issues=true, 6 open as of
  #   # 2026-09-13), and the issue-opening step re-checks live at :97 anyway, so it
  #   # would no longer fail the way the four scheduled runs in Apr-May 2026 did
  #   # ("the 'asklokesh/loki-mode' repository has disabled issues", exit 1).
  #   #
  #   # The cron stays off for a DIFFERENT and durable reason: this gate guards
  #   # "Phase 6 -- Sunset of Bash" for a v8.0.0 release that SHIPPED long ago.
  #   # Measured 2026-09-13: VERSION is 9.49.4, v8.0.0 is a real tag, and there are
  #   # 127 v8.x plus 41 v9.x tags behind us. The premise is also false on its own
  #   # terms -- bash was never sunset; autonomy/run.sh is still 27k lines and still
  #   # the default route (bin/loki, LOKI_SDK_MODE defaults to off).
  #   #
  #   # So the check reports 6 genuine NOT-READY preconditions against a milestone
  #   # the repository has already shipped past. Re-enabling would open a weekly
  #   # "readiness regression" issue about a dead milestone. Re-enable only if
  #   # loki-ts/docs/phase6-readiness-checklist.md is first rewritten for a live
  #   # target; until then workflow_dispatch is the honest surface.
  #   - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-phase6:
    name: check-phase6-ready
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
          # Rule of Two: this job holds a write token or publish secret, so it
          # never restores a cache an issue-triggered job could have written.
          no-cache: true

      - name: Install loki-ts dependencies
        working-directory: loki-ts
        run: bun install

      - name: Run check-phase6-ready
        id: check
        working-directory: loki-ts
        run: |
          set +e
          bun run scripts/check-phase6-ready.ts | tee /tmp/phase6-output.txt
          ec=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          if [ "$ec" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture JSON snapshot (best-effort)
        if: always()
        run: |
          mkdir -p /tmp/phase6
          cp /tmp/phase6-output.txt /tmp/phase6/output.txt 2>/dev/null || true
          # Synthesize a JSON envelope so downstream tooling has structured data.
          python3 - <<'PY'
          import json, os
          out = ""
          try:
              with open("/tmp/phase6-output.txt") as f:
                  out = f.read()
          except Exception:
              pass
          envelope = {
              "exit_code": int("${{ steps.check.outputs.exit_code }}" or "1"),
              "ready": "${{ steps.check.outputs.ready }}" == "true",
              "output": out,
              "ref": os.environ.get("GITHUB_REF", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
          }
          with open("/tmp/phase6/result.json", "w") as f:
              json.dump(envelope, f, indent=2)
          PY

      - name: Upload Phase 6 readiness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-readiness
          path: /tmp/phase6/
          if-no-files-found: warn
          retention-days: 90

      - name: Open issue on first-time failure
        if: steps.check.outputs.ready == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Guard: skip issue creation when GitHub Issues are disabled on the repo.
          # Artifact upload above is unaffected; this step exits 0 so the workflow stays green.
          issues_enabled=$(gh repo view "$GITHUB_REPOSITORY" --json hasIssuesEnabled --jq .hasIssuesEnabled 2>/dev/null || echo "false")
          if [ "$issues_enabled" != "true" ]; then
            echo "INFO: GitHub Issues disabled for $GITHUB_REPOSITORY -- skipping issue creation (artifact still uploaded)"
            exit 0
          fi
          existing=$(gh issue list --label phase6-not-ready --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$existing" ]; then
            echo "Existing tracking issue #$existing -- not opening a duplicate"
            exit 0
          fi
          TITLE="Phase 6 readiness regression ($(date -u +%Y-%m-%d))"
          {
            echo "Weekly Phase 6 readiness check failed."
            echo ""
            echo "Output:"
            echo '```'
            cat /tmp/phase6-output.txt
            echo '```'
            echo ""
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/phase6/issue-body.md
          gh issue create --title "$TITLE" --body-file /tmp/phase6/issue-body.md --label phase6-not-ready || \
            gh issue create --title "$TITLE" --body-file /tmp/phase6/issue-body.md
