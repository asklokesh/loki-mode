name: Nightly

# S-90: bun=latest, the macOS bun job, and the hyperfine benchmark used to run
# on every push/PR in test.yml. They're slow and their signal (upstream Bun
# breakage, perf regressions) doesn't need push-latency, so they moved here.
# Same steps as the pinned ubuntu/1.3.13 job in full-suite.yml, just the other
# 3 os x bun-version combos, plus hyperfine.
#
# D90: this is also the BACKSTOP for the fast push/release gate (test.yml).
# The `full` job below runs every suite the fast gate skips. A red `full`
# makes this run red, and per D96 promote.yml refuses to move latest
# while the newest nightly covering the promoted commit is red (next is
# unaffected). In the bun matrix only the bun=latest legs (`experimental: true`)
# are informational: upstream Bun drift must not hold a release. The pinned
# bun 1.3.13 legs (macOS) are BLOCKING, because a failure there is a real
# product failure, not drift (FC-57: the old job-level continue-on-error hid a
# deterministic macOS failure and the run concluded success, so D90 saw green).
# The first-run gate (stub provider, pinned bun, no network) is deterministic
# and also blocking. tests/test-workflow-no-masked-failures.sh fails on any
# new unconditional continue-on-error or masked test command.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # D90 backstop: the complete suite set (Node 20/24, Python matrix, 8 shell
  # shards, full moat, Helm, full bun). Blocking for the NEXT release.
  full:
    name: Full suite (backstop)
    uses: ./.github/workflows/full-suite.yml

  # GITLEAKS-INCR: a main push scans only <previous release tag>..SHA
  # (security-audit.yml). The complete-history gitleaks scan lives here as the
  # backstop. It has no continue-on-error, so a hit makes this run red, and
  # promote.yml refuses to move latest while the newest nightly covering the
  # promoted commit is red (a P0 fix-forward slice follows). Same pinned
  # binary, checksum and script as security-audit.yml; GITLEAKS_RANGE is unset,
  # which is the full-history scan.
  gitleaks-full-history:
    # The name must NOT start with "Full suite (backstop)": promote.yml counts
    # a nightly as measured when any non-skipped job carries that prefix, so a
    # dedupe-skipped run with this green job would be taken for a measurement.
    name: gitleaks full history (backstop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # Full history and tags: a shallow checkout would turn this into a
        # tip-only gate.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          printf '%s  %s\n' \
            '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e' \
            /tmp/gitleaks.tar.gz | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: gitleaks scan (all reachable history)
        env:
          GITLEAKS_BIN: /tmp/gitleaks
          GITLEAKS_BEFORE: ''
          GITLEAKS_TIP: ${{ github.sha }}
          GITLEAKS_REPORT: /tmp/gitleaks-report.json
        run: |
          set -euo pipefail
          bash scripts/security-audit-gitleaks.sh

      - name: Assert the secret scan completed cleanly
        run: |
          set -euo pipefail
          if [ ! -f /tmp/gitleaks-report.json ]; then
            echo "FAIL: gitleaks produced no report -- the tree was NOT scanned"
            exit 1
          fi
          n=$(python3 -c "import json,sys; print(len(json.load(open('/tmp/gitleaks-report.json'))))")
          if [ "$n" -ne 0 ]; then
            echo "FAIL: gitleaks reported $n unmatched finding(s)"
            exit 1
          fi
          echo "gitleaks reported zero unmatched findings"

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-full-history-report
          path: /tmp/gitleaks-report.json
          if-no-files-found: error

  # Moved from first-run-gate.yml (D90): stub provider, no keys. Deterministic
  # (pinned bun, no network, no billable call), so a red here is a real
  # first-run regression and must fail the run (FC-57).
  first-run-gate:
    name: first-run gate (stub)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - name: Run the gate
        run: bash scripts/first-run-gate.sh --stub

  bun-tests-nightly:
    # Per-leg: only matrix legs marked experimental (bun=latest) may fail
    # without failing the run. The pinned 1.3.13 legs block.
    continue-on-error: ${{ matrix.experimental == true }}
    name: Bun tests on ${{ matrix.os }} bun=${{ matrix.bun-version }} (nightly)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun-version: ["1.3.13", "latest"]
        exclude:
          # ubuntu/1.3.13 already runs on every push/PR in test.yml.
          - os: ubuntu-latest
            bun-version: "1.3.13"
        include:
          # Upstream-drift legs: informational. Pinned legs stay blocking.
          - os: ubuntu-latest
            bun-version: "latest"
            experimental: true
          - os: macos-latest
            bun-version: "latest"
            experimental: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Setup Python (for bash route fallthroughs)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js (for shim fallthroughs to bash CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python deps used by bash CLI tests
        run: |
          python3 -m pip install --upgrade pip
          # pytest: engine10 wall.test.ts runs real pytest through a .venv shim (S41-16, D42 (3)).
          python3 -m pip install pydantic httpx fastapi uvicorn pytest

      - name: Install Node deps used by bash CLI tests
        run: npm install --no-package-lock

      - name: Install loki-ts dependencies
        working-directory: loki-ts
        run: bun install

      - name: Typecheck loki-ts
        working-directory: loki-ts
        run: bun run typecheck

      - name: Run loki-ts unit tests
        working-directory: loki-ts
        run: bun test

      - name: Build loki-ts bundle (for the SDK bridge tests + bin/loki)
        working-directory: loki-ts
        run: bun run build

      # v8: the raw-SDK judge/text bridges. With bun + the built bundle present,
      # these run the wiring / opt-in / binary-free-ordering / mocked-success
      # assertions FOR REAL (they self-skip only when bun is absent). No API key
      # is set, so every path is exercised fail-closed -- no billable call.
      - name: Run v8 SDK bridge tests (fail-closed, no ANTHROPIC_API_KEY)
        run: |
          bash tests/test-sdk-done-recog-bridge.sh
          bash tests/test-sdk-text-bridge.sh
          bash tests/test-sdk-council-vote.sh
          bash tests/test-sdk-voter-agents.sh
          bash tests/test-sdk-loop-routing.sh
          bash tests/test-sdk-mode.sh
          bash tests/test-bundled-sdk-provider.sh
          bash tests/test-sandbox-deprecation.sh
          bash tests/test-acceptance-resume-idempotence.sh

      # First-run funnel privacy. Stubs curl and asserts on the real POST body,
      # so it observes what would actually reach the wire (the reverted attempt's
      # test stubbed loki_telemetry itself and could never see a leak). Hermetic:
      # fake HOME, fake curl on PATH, no real network send. It sets
      # LOKI_TELEMETRY=on explicitly, which by the documented gate precedence
      # overrides the CI auto-off, so the gates are genuinely open here.
      - name: Run first-run funnel privacy tests (stubbed curl, no real egress)
        run: bash tests/test-funnel-privacy.sh

      - name: Run CLI tests via bash route (LOKI_LEGACY_BASH=1)
        env:
          LOKI_LEGACY_BASH: "1"
        run: bash tests/test-cli-commands.sh

      - name: Run CLI tests via Bun shim route
        run: PATH="$PWD/bin:$PATH" bash tests/test-cli-commands.sh

      - name: Install hyperfine (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y hyperfine

      - name: Install hyperfine (macOS)
        if: runner.os == 'macOS'
        run: brew install hyperfine

      - name: Sanity bench-suite (hyperfine, 5 runs, 1 warmup)
        working-directory: loki-ts
        run: bun run scripts/bench-suite.ts --runs 5 --warmup 1
