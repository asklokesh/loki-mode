name: Tests

on:
  push:
    # D90: this workflow IS the fast gate (it absorbed Tier A). It runs on
    # main, train/** and slice-* pushes and on PRs; the full suites moved to
    # nightly.yml (full-suite.yml), non-blocking for the push, blocking for
    # the NEXT release through release.yml required-ci.
    branches: [main, "train/**", "slice-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # E-162: train/** pushes share one group per ref, so a newer train push
  # cancels a superseded train's in-progress Tests. main keeps a per-SHA
  # group and is never cancelled (Tier B / release verdict).
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/train/')) && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/train/') }}

jobs:
  # Runs first on every push and PR. Two jobs in one:
  #
  # 1. The version-bump consistency checks, UNCONDITIONALLY. A bump-only diff
  #    can still corrupt a dependency spec that happens to contain the old
  #    version ("^29.7.0" -> "^29.8.0" on a 9.7.0 -> 9.8.0 bump is
  #    byte-identical modulo the version, and took down every job in v9.8.0),
  #    or forget a file that must track VERSION (server.json, plugin.json),
  #    so these never skip, whatever the gate decides.
  # 2. The skip decision (S-132). skip=true only when the push is a
  #    version-bump-only commit by the same rules as release.yml required-ci
  #    STEP 1 (tests/test-version-bump-only.sh holds the two in parity) AND
  #    the parent has a completed, successful push-event Tests run. Pending,
  #    red, absent, or unreadable means skip=false and the full suite runs;
  #    it never waits. This check matters because a Tests run whose jobs all
  #    skip concludes success, and required-ci accepts success at the release
  #    SHA without looking at the parent.
  #
  # Every other job has `needs` on this one and `!cancelled()` in its `if`:
  # if this job fails, skip is empty, the full suite still runs, and the run
  # is still red. Without `!cancelled()` a failed gate would silently skip
  # the whole suite.
  version-bump-gate:
    name: Version-bump gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      # E-160 / D55: skip also when a train/** run already verified this exact SHA.
      skip: ${{ steps.gate.outputs.skip == 'true' || steps.reuse.outputs.reuse == 'true' }}
    steps:
      - name: Checkout (pushed commit plus its parent)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Version-bump consistency (never skipped)
        run: |
          python3 tests/test_version_bump_safety.py
          bash tests/test-server-json-current.sh
          bash tests/test-plugin-json-current.sh

      - name: Decide whether the heavy jobs can reuse the parent's Tests verdict
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci/version-bump-only.sh gate >> "$GITHUB_OUTPUT"

      # E-160 / D55: a main push of a SHA a train/** Tests run already passed
      # reuses that verdict. Lockfile changes since BEFORE, a failed or
      # truncated compare, or any API doubt give reuse=false (full suite).
      - name: Reuse a train run's verdict for this exact SHA
        id: reuse
        continue-on-error: true
        env:
          WF_FILE: test.yml
          CACHE_KEY_FILES: loki-ts/bun.lock requirements-test.txt
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          LOKI_E160_REUSE: ${{ vars.LOKI_E160_REUSE }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/train-verdict-reuse.sh gate

  # D90: the blocking gate. Plan once, then run only what the diff can affect,
  # in parallel jobs that each target under 90s. Everything it skips runs in
  # the nightly full suite, and a red nightly blocks the NEXT release.
  plan:
    name: Plan (diff to suites)
    needs: [version-bump-gate]
    if: ${{ !cancelled() && needs.version-bump-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # PLAN-TIMEOUT-1: 15 min; a timeout fails toward FULL (see the full-suite job if:)
    timeout-minutes: 15
    outputs:
      full: ${{ steps.plan.outputs.full }}
      shards: ${{ steps.plan.outputs.shards }}
      has_shards: ${{ steps.plan.outputs.has_shards }}
    steps:
      - name: Checkout (full history and tags for the last-release base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Base: PRs diff against their target branch, slice-* pushes against
      # origin/main, main and train/** against the last release tag. An
      # unresolvable base or diff makes the plan FULL (fail safe).
      - name: Compute the plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          BASE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/${BASE_REF}"
          elif [[ "$REF_NAME" == slice-* ]]; then
            BASE="origin/main"
          fi
          bash scripts/ci/fast-gate.sh plan "$BASE" HEAD "$RUNNER_TEMP/plan" || true
          [ -f "$RUNNER_TEMP/plan/outputs.txt" ] || printf 'full=true\nshards=[]\nhas_shards=false\n' > "$RUNNER_TEMP/plan/outputs.txt"
          cat "$RUNNER_TEMP/plan/outputs.txt" >> "$GITHUB_OUTPUT"
          {
            echo '### Fast gate plan'
            echo '```'
            cat "$RUNNER_TEMP/plan/plan.tsv" 2>/dev/null || true
            echo '--- deferred to nightly (estimated over 80s) ---'
            cat "$RUNNER_TEMP/plan/deferred.tsv" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: fast-gate-plan
          path: ${{ runner.temp }}/plan/plan.tsv
          if-no-files-found: error

  # tsc plus the dist build, once. The shards reuse the built dist.
  typecheck-build:
    name: Typecheck and build dist
    needs: [version-bump-gate]
    if: ${{ !cancelled() && needs.version-bump-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('loki-ts/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install loki-ts dependencies
        working-directory: loki-ts
        run: bun install --frozen-lockfile

      - name: Typecheck loki-ts (tsc)
        working-directory: loki-ts
        run: bun run typecheck

      - name: Build loki-ts bundle (once)
        working-directory: loki-ts
        run: bun run build

      - name: Upload the built dist
        uses: actions/upload-artifact@v4
        with:
          name: loki-ts-dist
          path: loki-ts/dist
          if-no-files-found: error
          retention-days: 3

  structural:
    name: Structural guards
    needs: [version-bump-gate]
    if: ${{ !cancelled() && needs.version-bump-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for the emoji and dash scan base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Structural checks
        run: bash scripts/structural-checks.sh

      - name: Shard coverage
        run: bash tests/test-shard-coverage.sh

  # Moat P9 (Rule of Two) only. The full moat suite (P1..P9 plus the registry
  # ratchet) runs nightly. P9 measured 13s locally; the old 2.5 min moat job
  # was mostly its setup and the other eight properties.
  moat-p9:
    name: Moat P9 (Rule of Two)
    needs: [version-bump-gate]
    if: ${{ !cancelled() && needs.version-bump-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (the workflow scan prerequisite)
        run: python3 -m pip install pyyaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('loki-ts/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install loki-ts dependencies
        working-directory: loki-ts
        run: bun install --frozen-lockfile

      - name: Run P9
        run: bash scripts/ci/fast-gate.sh p9

  selected:
    name: Impacted suites (shard ${{ matrix.shard }})
    needs: [version-bump-gate, plan, typecheck-build]
    if: ${{ !cancelled() && needs.version-bump-gate.outputs.skip != 'true' && needs.plan.result == 'success' && needs.plan.outputs.full != 'true' && needs.plan.outputs.has_shards == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the plan
        uses: actions/download-artifact@v4
        with:
          name: fast-gate-plan
          path: ${{ runner.temp }}/plan

      - name: Download the built dist
        uses: actions/download-artifact@v4
        with:
          name: loki-ts-dist
          path: loki-ts/dist

      - name: Install gitleaks (pinned, checksum-verified)
        run: bash scripts/install-gitleaks.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node.js dependencies
        run: npm install --no-package-lock

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('loki-ts/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install loki-ts dependencies
        working-directory: loki-ts
        run: bun install --frozen-lockfile

      - name: Run this shard
        run: bash scripts/ci/fast-gate.sh run "$RUNNER_TEMP/plan/plan.tsv" "${{ matrix.shard }}"

  # Fail-safe: the diff could not be computed, so the whole matrix runs.
  full-fallback:
    name: Full suite (diff not computable)
    needs: [version-bump-gate, plan]
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.full == 'true') && needs.version-bump-gate.outputs.skip != 'true' }}
    uses: ./.github/workflows/full-suite.yml
