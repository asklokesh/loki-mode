name: Tests

on:
  push:
    # D44: train/N branches run Tier B before main is fast-forwarded to them.
    # E-162: slice-* pushes do NOT run this workflow (no 8-shard matrix); the
    # Tier A workflow runs the structural guards and diff-selected suites
    # there. The train stays the release verdict.
    branches: [main, "train/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # E-162: train/** pushes share one group per ref, so a newer train push
  # cancels a superseded train's in-progress Tests. main keeps a per-SHA
  # group and is never cancelled (Tier B / release verdict).
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/train/')) && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/train/') }}

jobs:
  # Runs first on every push and PR. Two jobs in one:
  #
  # 1. The version-bump consistency checks, UNCONDITIONALLY. A bump-only diff
  #    can still corrupt a dependency spec that happens to contain the old
  #    version ("^29.7.0" -> "^29.8.0" on a 9.7.0 -> 9.8.0 bump is
  #    byte-identical modulo the version, and took down every job in v9.8.0),
  #    or forget a file that must track VERSION (server.json, plugin.json),
  #    so these never skip, whatever the gate decides.
  # 2. The skip decision (S-132). skip=true only when the push is a
  #    version-bump-only commit by the same rules as release.yml required-ci
  #    STEP 1 (tests/test-version-bump-only.sh holds the two in parity) AND
  #    the parent has a completed, successful push-event Tests run. Pending,
  #    red, absent, or unreadable means skip=false and the full suite runs;
  #    it never waits. This check matters because a Tests run whose jobs all
  #    skip concludes success, and required-ci accepts success at the release
  #    SHA without looking at the parent.
  #
  # Every other job has `needs` on this one and `!cancelled()` in its `if`:
  # if this job fails, skip is empty, the full suite still runs, and the run
  # is still red. Without `!cancelled()` a failed gate would silently skip
  # the whole suite.
  version-bump-gate:
    name: Version-bump gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      # E-160 / D55: skip also when a train/** run already verified this exact SHA.
      skip: ${{ steps.gate.outputs.skip == 'true' || steps.reuse.outputs.reuse == 'true' }}
    steps:
      - name: Checkout (pushed commit plus its parent)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Version-bump consistency (never skipped)
        run: |
          python3 tests/test_version_bump_safety.py
          bash tests/test-server-json-current.sh
          bash tests/test-plugin-json-current.sh

      - name: Decide whether the heavy jobs can reuse the parent's Tests verdict
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci/version-bump-only.sh gate >> "$GITHUB_OUTPUT"

      # E-160 / D55: a main push of a SHA a train/** Tests run already passed
      # reuses that verdict. Lockfile changes since BEFORE, a failed or
      # truncated compare, or any API doubt give reuse=false (full suite).
      - name: Reuse a train run's verdict for this exact SHA
        id: reuse
        continue-on-error: true
        env:
          WF_FILE: test.yml
          CACHE_KEY_FILES: loki-ts/bun.lock requirements-test.txt
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          LOKI_E160_REUSE: ${{ vars.LOKI_E160_REUSE }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/train-verdict-reuse.sh gate

  node-tests:
    name: Node.js ${{ matrix.node-version }}
    needs: [version-bump-gate]
    if: ${{ !cancelled() && needs.version-bump-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]  # engines.node floor (>=20) plus newest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm test

  python-tests:
    name: Python ${{ matrix.python-version }}
    needs: [version-bump-gate]
    if: ${{ !cancelled() && needs.version-bump-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]  # sdk/python requires-python floor plus newest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      # E-157: tests/test_release_required_ci.py drives release.yml's PARENT..SHA
      # secret scan with the real pinned gitleaks and FAILS (never skips) when CI
      # lacks it.
      - name: Install gitleaks (pinned, checksum-verified)
        run: bash scripts/install-gitleaks.sh

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Install from the canonical list, not a hand-maintained subset -- the
          # same fix shell-tests already made after its own drift incident (see
          # the comment on that job). Two hand-written lists for one test suite
          # drift apart by construction; one source cannot.
          #
          # This list also carries the pinned `mcp`, which the hand-written one
          # omitted. Note that installing it does NOT by itself un-skip
          # tests/test_mcp_agent_metrics_honesty.py: the repo's own `mcp/`
          # package shadows the installed SDK on sys.path, so `from mcp import
          # server` reaches our module, which then cannot import the SDK and
          # exits. That shadowing is a separate defect, tracked separately --
          # what this change fixes is the drift, not the skip.
          python3 -m pip install -r requirements-test.txt

      - name: Run tests
        run: python3 -m pytest -n auto

  shell-tests:
    name: Shell tests (shard ${{ matrix.shard }}/8)
    needs: [version-bump-gate]
    if: ${{ !cancelled() && needs.version-bump-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SHARDED because this job WAS the pipeline. Measured 2026-07-30 at 4
    # shards / 289 suites: Shell tests 13m01s, next slowest job 2m17s.
    #
    # RESHARDED 4 -> 8 with DURATION-BALANCED packing (S-81), not plain
    # `idx % n`. A plain index split ignores that suites are wildly uneven
    # (496 suites today, 0-153s each per tests/shard-durations.tsv), so
    # whichever shard happened to catch the slow suites set the whole
    # workflow's wall clock regardless of shard count. tests/run-all-tests.sh
    # now assigns each suite to a shard via a deterministic greedy
    # longest-first (LPT) bin-packing over that measured duration table,
    # instead of by index -- see the SHARDING comment there for the
    # algorithm. Projected from that same table (not a new CI run): all 8
    # shards land at ~197s of suite time (~3.3min) plus job setup, comfortably
    # under a 6-minute per-shard target; see docs/v10/METRICS.md.
    #
    # fail-fast is OFF deliberately: one shard failing must not cancel the
    # others, or a single red suite hides every other failure and the next
    # push rediscovers them one cycle at a time.
    #
    # Safety: tests/test-shard-coverage.sh proves the shards partition the
    # suite list exactly (every suite in exactly one shard, none dropped, none
    # duplicated) and that an invalid shard spec exits non-zero rather than
    # silently running nothing -- for n in [2, 3, 4, 6, 8], driven through the
    # real runtime path (LOKI_TEST_LIST=1), not a re-implementation of the
    # packing algorithm.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # E-159: tests/test-security-audit-config.sh drives the secret-scan script with the
      # real pinned gitleaks and FAILS (never skips) under CI when it is absent.
      - name: Install gitleaks (pinned, checksum-verified)
        run: bash scripts/install-gitleaks.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Install from the canonical list, not a hand-maintained subset. This
          # job previously installed only "pydantic httpx fastapi uvicorn" and
          # omitted sqlalchemy/aiosqlite, so every shell test that imports
          # dashboard/server.py died with
          #   ModuleNotFoundError: No module named 'sqlalchemy'
          # and reported as a product failure. Five suites were red for that one
          # missing dependency. Sourcing requirements-test.txt keeps this job and
          # the python-tests job from drifting apart again.
          python3 -m pip install -r requirements-test.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node.js dependencies
        run: npm install --no-package-lock

      # REQUIRED, not optional. tests/test-trust-core-tests-detect.sh runs two
      # mutation probes as `cd loki-ts && bun test ...`. Without bun the probe
      # baseline exits 127, the probe reports rc=67, and the suite goes red --
      # which is the honest outcome, but the cause is a missing toolchain here,
      # not a defect in the trust core.
      #
      # These probes are deliberately NOT skipped when bun is absent: they guard
      # the trust core, and a probe that silently does not run is an absent
      # measurement reported as a pass.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('loki-ts/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install loki-ts dependencies (for the TS mutation probes)
        working-directory: loki-ts
        run: bun install

      - name: Run shell tests (shard ${{ matrix.shard }} of 8)
        env:
          LOKI_TEST_SHARD: ${{ matrix.shard }}/8
        run: bash tests/run-all-tests.sh

  # The moat suite: nine product properties, each PROVEN or honestly NOT
  # PROVEN. A release that fails it does not ship (release.yml required-ci
  # waits for this whole workflow). Its own job, not a shard: the pending list
  # and the case registry are ratcheted against the reachable release tags, and
  # the shards' depth-1 checkout
  # has no tags, so the runner would exit 2 ("could not check") there by design.
  # The toolchain mirrors shell-tests because the property scripts drive loki
  # on both routes (Bun and bash) and the signing checks import cryptography.
  moat-suite:
    name: Moat rules (no regression)
    needs: [version-bump-gate]
    if: ${{ !cancelled() && needs.version-bump-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history, so release tags exist for the ratchet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node.js dependencies
        run: npm install --no-package-lock

      # Pinned to what release.yml's gate uses, so a Bun release cannot flip
      # this job alone.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('loki-ts/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install loki-ts dependencies
        working-directory: loki-ts
        run: bun install

      # P7's two route cases parse client paths with the TypeScript AST from
      # web-app/node_modules/typescript. Without it they FAIL as "prerequisite
      # missing" and never measure the routes. Measured 2026-09-25: 2s with a
      # cold npm cache (254 packages).
      - name: Install web-app dependencies (TypeScript for P7)
        working-directory: web-app
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The job's green check means "no rule failed", not "moat proven". The
      # step summary carries the real count so a reader of the check sees it.
      - name: Run the moat suite
        run: |
          rc=0
          bash tests/moat/run.sh > "$RUNNER_TEMP/moat.out" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/moat.out"
          {
            echo '### Moat rules (no regression)'
            echo '```'
            grep -E '^(P[1-9] |moat:|moat suite:|ratchet:|registry:)' "$RUNNER_TEMP/moat.out" || echo "no summary lines (exit $rc)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  helm-lint:
    name: Helm lint
    needs: [version-bump-gate]
    if: ${{ !cancelled() && needs.version-bump-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint deploy/helm/autonomi

      # LINT IS NOT ENOUGH ON ITS OWN. `helm lint` renders with the DEFAULT
      # values, where ingress and keda are off and worker.mode is "job". Every
      # template guarded by `{{- if .Values.ingress.enabled }}` or the
      # deployment/serverless worker branches is therefore never exercised, so a
      # broken conditional ships green and only fails for the operator who turns
      # that feature on.
      #
      # Rendering each optional path costs seconds and is the difference between
      # "the chart parses" and "the chart works in the configurations we
      # document".
      - name: Render optional paths
        run: |
          set -euo pipefail
          for combo in \
            "ingress.enabled=true" \
            "keda.enabled=true" \
            "worker.mode=deployment" \
            "worker.mode=serverless" \
            "security.networkPolicy.enabled=true"
          do
            echo "== helm template --set ${combo}"
            helm template ci deploy/helm/autonomi --set "${combo}" > /dev/null
          done

      # The schema must REJECT bad values, not merely exist. A schema that
      # accepts everything looks like validation and is not.
      - name: values.schema.json rejects bad values
        run: |
          set -uo pipefail
          if helm template ci deploy/helm/autonomi --set worker.mode=Deployment >/dev/null 2>&1; then
            echo "FAIL: worker.mode=Deployment was accepted; the schema is not enforcing"
            exit 1
          fi
          echo "OK: invalid worker.mode rejected by values.schema.json"

  bun-tests:
    name: Bun tests on ${{ matrix.os }} bun=${{ matrix.bun-version }}
    needs: [version-bump-gate]
    if: ${{ !cancelled() && needs.version-bump-gate.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # S-90: macos-latest and bun=latest moved to nightly.yml so a flaky
        # upstream Bun release or a slow macOS runner no longer gates every
        # push/PR. The pinned ubuntu/1.3.13 combo (the version shipped in the
        # Dockerfile) still runs here.
        os: [ubuntu-latest]
        bun-version: ["1.3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun ${{ matrix.bun-version }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Setup Python (for bash route fallthroughs)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Setup Node.js (for shim fallthroughs to bash CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python deps used by bash CLI tests
        run: |
          python3 -m pip install --upgrade pip
          # pytest: engine10 wall.test.ts runs real pytest through a .venv shim (S41-16, D42 (3)).
          python3 -m pip install pydantic httpx fastapi uvicorn pytest

      - name: Install Node deps used by bash CLI tests
        run: npm install --no-package-lock

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('loki-ts/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install loki-ts dependencies
        working-directory: loki-ts
        run: bun install

      - name: Typecheck loki-ts
        working-directory: loki-ts
        run: bun run typecheck

      - name: Run loki-ts unit tests
        working-directory: loki-ts
        run: bun test

      - name: Build loki-ts bundle (for the SDK bridge tests + bin/loki)
        working-directory: loki-ts
        run: bun run build

      # v8: the raw-SDK judge/text bridges. With bun + the built bundle present,
      # these run the wiring / opt-in / binary-free-ordering / mocked-success
      # assertions FOR REAL (they self-skip only when bun is absent). No API key
      # is set, so every path is exercised fail-closed -- no billable call.
      - name: Run v8 SDK bridge tests (fail-closed, no ANTHROPIC_API_KEY)
        run: |
          bash tests/test-sdk-done-recog-bridge.sh
          bash tests/test-sdk-text-bridge.sh
          bash tests/test-sdk-council-vote.sh
          bash tests/test-sdk-voter-agents.sh
          bash tests/test-sdk-loop-routing.sh
          bash tests/test-sdk-mode.sh
          bash tests/test-bundled-sdk-provider.sh
          bash tests/test-sandbox-deprecation.sh
          bash tests/test-acceptance-resume-idempotence.sh

      # First-run funnel privacy. Stubs curl and asserts on the real POST body,
      # so it observes what would actually reach the wire (the reverted attempt's
      # test stubbed loki_telemetry itself and could never see a leak). Hermetic:
      # fake HOME, fake curl on PATH, no real network send. It sets
      # LOKI_TELEMETRY=on explicitly, which by the documented gate precedence
      # overrides the CI auto-off, so the gates are genuinely open here.
      - name: Run first-run funnel privacy tests (stubbed curl, no real egress)
        run: bash tests/test-funnel-privacy.sh

      - name: Run CLI tests via bash route (LOKI_LEGACY_BASH=1)
        env:
          LOKI_LEGACY_BASH: "1"
        run: bash tests/test-cli-commands.sh

      - name: Run CLI tests via Bun shim route
        run: PATH="$PWD/bin:$PATH" bash tests/test-cli-commands.sh
        # S-90: hyperfine install + bench-suite moved to nightly.yml so the
        # benchmark no longer gates every push/PR.
