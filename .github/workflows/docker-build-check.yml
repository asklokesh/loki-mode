name: Docker Build Check

# Builds docker/Dockerfile and docker/Dockerfile.control-plane from the repo
# root context on every change that can affect either image. Build only: it
# never logs in, never pushes, holds no secrets, and has a read-only token.
# Non-blocking for release: it is not part of required-ci or release.yml.
on:
  push:
    paths:
      - 'docker/**'
      - 'loki-ts/**'
      - 'packages/control-plane/**'
      - 'package.json'
      - 'package-lock.json'
      - 'loki-ts/bun.lock'
      - 'packages/control-plane/bun.lock'
      - 'packages/control-plane/ui/bun.lock'
      - '.github/workflows/docker-build-check.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'loki-ts/**'
      - 'packages/control-plane/**'
      - 'package.json'
      - 'package-lock.json'
      - 'loki-ts/bun.lock'
      - 'packages/control-plane/bun.lock'
      - 'packages/control-plane/ui/bun.lock'
      - '.github/workflows/docker-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build images (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (for loki-ts build before docker context)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Build loki-ts dist (Dockerfile COPY needs loki-ts/dist/loki.js)
        working-directory: loki-ts
        run: |
          bun install --production
          bun run build
          test -f dist/loki.js || { echo "FATAL: loki-ts/dist/loki.js not built"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker/Dockerfile (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=docker-build-check-loki-mode
          cache-to: type=gha,mode=max,scope=docker-build-check-loki-mode

      - name: Build docker/Dockerfile.control-plane (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.control-plane
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=docker-build-check-control-plane
          cache-to: type=gha,mode=max,scope=docker-build-check-control-plane
