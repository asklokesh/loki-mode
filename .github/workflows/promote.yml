name: Promote

# A-01: releases publish to the npm `next` dist-tag (release.yml). `latest`,
# Docker `:latest` and the Homebrew formula move ONLY here, after the
# first-run gate passes on the exact version installed from npm. Nothing here
# commits to main; the result is the PROMOTED line in the job log.
#
# PyPI has no dist-tag equivalent, so loki-mode-sdk on PyPI is not gated.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to promote (no leading v, e.g. 10.5.11)'
        required: true
        type: string

# One promote at a time; never cancel one that is mid-flight.
concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FATAL: version must be exact semver X.Y.Z, got '$VERSION'"
            exit 1
          fi

      - name: Checkout (full history for the gitHead ancestry check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # POLICY: promoting an older next build is allowed only if its gitHead
      # (the commit npm recorded at publish) is an ancestor of, or equal to,
      # origin/main. A build from a branch or a force-pushed-away commit can
      # never become latest. A next tag that points elsewhere is informational.
      - name: Verify published version and its gitHead is on main
        id: npm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          FOUND="$(npm view "loki-mode@${VERSION}" version)"
          test "$FOUND" = "$VERSION" || { echo "FATAL: loki-mode@${VERSION} not found on npm"; exit 1; }
          GITHEAD="$(npm view "loki-mode@${VERSION}" gitHead)"
          test -n "$GITHEAD" || { echo "FATAL: loki-mode@${VERSION} has no gitHead on npm"; exit 1; }
          printf '%s' "$GITHEAD" | grep -Eq '^[0-9a-f]{40}$' || { echo "gitHead is not a 40-hex SHA: $GITHEAD"; exit 1; }
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHEAD" origin/main; then
            echo "FATAL: gitHead ${GITHEAD} of loki-mode@${VERSION} is not an ancestor of origin/main"
            exit 1
          fi
          NEXT="$(npm view loki-mode dist-tags.next)"
          echo "npm next tag: ${NEXT}; promoting ${VERSION} (gitHead ${GITHEAD} is on main)"
          echo "githead=${GITHEAD}" >> "$GITHUB_OUTPUT"

      # FAIL CLOSED: a missing gate script is a failed promote, never a skip.
      - name: First-run gate on the exact installed version
        id: gate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/first-run-gate.sh ]; then
            echo "FATAL: scripts/first-run-gate.sh is missing; refusing to promote without a gate pass"
            exit 1
          fi
          bash scripts/first-run-gate.sh --installed "loki-mode@${VERSION}"
          echo "result=PASS" >> "$GITHUB_OUTPUT"

      # PREFLIGHT for every channel BEFORE any latest moves, so a Docker or
      # Homebrew precondition failure leaves all channels on the old latest.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Preflight Docker (version tag exists)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker manifest inspect "asklokesh/loki-mode:v${VERSION}" > /dev/null

      - name: Preflight Homebrew (hash asset, render formula, read tap)
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          ASSET="loki-mode-${VERSION}.tar.gz"
          gh release download "v${VERSION}" --repo asklokesh/loki-mode --pattern "${ASSET}" --dir "$RUNNER_TEMP" --clobber
          file "${RUNNER_TEMP}/${ASSET}" | grep -q 'gzip compressed' || { echo "ERROR: asset is not a gzip tarball"; exit 1; }
          SHA256=$(sha256sum "${RUNNER_TEMP}/${ASSET}" | cut -d' ' -f1)
          rm -f "${RUNNER_TEMP}/${ASSET}"
          cat > "${RUNNER_TEMP}/loki-mode.rb.tpl" << 'FORMULA_EOF'
          class LokiMode < Formula
            desc "Autonomous coding agent platform CLI for Claude Code, Codex CLI, Cline, and Aider"
            homepage "https://github.com/asklokesh/loki-mode"
            url "https://github.com/asklokesh/loki-mode/releases/download/vVERSION_PLACEHOLDER/loki-mode-VERSION_PLACEHOLDER.tar.gz"
            sha256 "SHA256_PLACEHOLDER"
            license "BUSL-1.1"

            depends_on "node"
            depends_on "oven-sh/bun/bun"

            def install
              libexec.install Dir["*"]
              # bin/loki is the Bun-aware shim (v7.4.2 BUG-4); link it, not autonomy/loki.
              bin.install_symlink libexec/"bin/loki" => "loki"
            end

            test do
              system "#{bin}/loki", "--version"
            end
          end
          FORMULA_EOF
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g; s/SHA256_PLACEHOLDER/${SHA256}/g" "${RUNNER_TEMP}/loki-mode.rb.tpl" > "${RUNNER_TEMP}/loki-mode.rb"
          grep -q "sha256 \"${SHA256}\"" "${RUNNER_TEMP}/loki-mode.rb" || { echo "FATAL: formula render failed"; exit 1; }
          gh api repos/asklokesh/homebrew-tap/contents/Formula/loki-mode.rb --jq '.sha' > /dev/null

      - name: Move npm latest (loki-mode and loki-mode-sdk)
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm dist-tag add "loki-mode@${VERSION}" latest
          npm dist-tag add "loki-mode-sdk@${VERSION}" latest

      - name: Move Docker latest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t asklokesh/loki-mode:latest "asklokesh/loki-mode:v${VERSION}"

      - name: Update Homebrew formula via API
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api repos/asklokesh/homebrew-tap/contents/Formula/loki-mode.rb --jq '.sha')
          CONTENT=$(base64 < "${RUNNER_TEMP}/loki-mode.rb" | tr -d '\n')
          gh api repos/asklokesh/homebrew-tap/contents/Formula/loki-mode.rb \
            -X PUT \
            -f message="Update to v${VERSION}" \
            -f content="$CONTENT" \
            -f sha="$CURRENT_SHA"
          echo "Homebrew formula updated to v${VERSION}"

      # Workflows must not commit to main: the Release Manager copies this
      # line from the job summary into PROGRESS.md.
      - name: Record promotion
        env:
          VERSION: ${{ inputs.version }}
          GATE: ${{ steps.gate.outputs.result }}
          GITHEAD: ${{ steps.npm.outputs.githead }}
        run: |
          LINE="PROMOTED ${VERSION} gate=${GATE} gitHead=${GITHEAD}"
          echo "$LINE"
          echo "$LINE" >> "$GITHUB_STEP_SUMMARY"
