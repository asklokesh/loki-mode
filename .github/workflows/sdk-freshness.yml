name: sdk-freshness

# Anthropic SDK pins must never be more than 7 days behind the newest
# release. Scheduled here so release.yml stays push-only.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Anthropic SDK pins are within 7 days of the newest release
        run: python3 scripts/dep-inventory.py --sdk-freshness
