name: Tier A (fast feedback)

# Feedback only, not release authority: this selects and runs only the
# suites a change can plausibly affect (scripts/select-tests.sh, S-91), aimed
# at 2 minutes for a typical PR diff. It never replaces Tier B: the full
# "Tests" workflow (test.yml) still runs on every push/PR to main and is what
# actually gates. R0 (a broad-blast-radius or unrecognized-path diff) is the
# declared exception to the 2-minute target: it runs the full
# tests/run-all-tests.sh suite instead, which is why the job timeout below is
# generous rather than tight.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tier-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-and-run:
    name: Tier A selected suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Python test dependencies (for R5 dashboard/web-app pytest)
        run: python3 -m pip install -r requirements-test.txt

      # oven-sh/setup-bun caches the bun install directory by default (no
      # no-cache: true set here), so bun installs are already cached; this
      # job holds no write permissions or secrets (P9 cache-channel rule),
      # so that default cache is safe to keep.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install loki-ts dependencies (for R4 bun test / typecheck)
        working-directory: loki-ts
        run: bun install

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install web-app dependencies (for R5 node_lint / pytest)
        working-directory: web-app
        run: npm ci --no-audit --no-fund

      - name: Select suites for this diff
        run: |
          bash scripts/select-tests.sh --base "origin/${{ github.base_ref }}"

      # R0 (broad-blast-radius or unrecognized-path diff) runs the full,
      # unsharded, serial tests/run-all-tests.sh suite here instead of the
      # capped per-suite selection. This repo's own measured data (test.yml,
      # scripts/local-ci.sh, CLAUDE.md) converges on ~24-27 minutes for that
      # exact serial run, so no step-level timeout is set here: the
      # job-level timeout-minutes above is the only cap, and it is already
      # sized generously for this path (see the file header comment).
      - name: Run selected suites
        run: |
          bash scripts/select-tests.sh --base "origin/${{ github.base_ref }}" --run
