name: Release

on:
  push:
    paths:
      - 'VERSION'
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_republish:
        description: 'Re-run publish jobs even if the GitHub release already exists (for fixing failed Docker/brew jobs)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # Gate: every downstream job (release, npm, docker, homebrew, ...) waits
  # for this job to pass. Prevents publishing artifacts when the test suite is red.
  #
  # S-84 (2026-09): this job no longer runs the Python suite. It used to pip
  # install a hand-picked subset of deps and run `python3 -m pytest -q` on
  # 3.12 only -- a strictly WEAKER duplicate of test.yml's python-tests job,
  # which runs the identical `python3 -m pytest` on 3.10-3.13 with the
  # canonical requirements-test.txt. required-ci (below) still requires that
  # workflow ("Tests") to succeed before release publishes, so deleting the
  # duplicate here costs no coverage, only the ~3m46s it used to spend on pip
  # installs before ever reaching the checks below.
  #
  # What replaced it: two no-pip version-file consistency probes. They exist
  # because required-ci can let a version-bump-only push reuse its PARENT
  # commit's Tests verdict -- and the files that reuse allowlist
  # covers (server.json, plugin.json, ...) are exactly the ones that drift
  # silently if a release forgets to bump them. Running them here, at the
  # release SHA itself, means that check is never skipped by the reuse path.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CHEAPEST FAILING CHECK FIRST. Step order here is not cosmetic: this job
      # gates every publish job, so whatever it runs first is how fast a broken
      # release finds out.
      #
      # v9.49.0 died on a one-line TS2322 in doctor.ts. The typecheck that
      # caught it was the LAST step, so the job first spent ~3m46s on pip
      # installs and the full pytest suite before tsc ran for 7 seconds and
      # failed. Measured on run 34724377951: gate 4m03s total, pip started
      # 23:03:29, pytest ended 23:07:15, Bun step 23:07:17 -> 23:07:24. The
      # pip/pytest steps that ran last are gone now (see above); this ordering
      # note is kept because the bash/Bun-before-anything-slower principle
      # still governs what gets added to this job.
      - name: Bash syntax validation
        run: |
          bash -n autonomy/run.sh
          bash -n autonomy/loki
      - name: P9 Rule of Two on the exact release SHA (never waived)
        # CTO N4: P9 must hold at the release SHA even if required-ci stops
        # enforcing Tests (D88 waiver, D97). Fail closed: a missing script or
        # any nonzero rc fails the gate. About 13s.
        run: |
          set -euo pipefail
          test -f scripts/ci/fast-gate.sh
          bash scripts/ci/fast-gate.sh p9
      - name: Setup Bun
        # publish-npm and publish-docker ship the loki-ts Bun dist. This job
        # only rebuilds it to prove the committed dist is the release SHA's.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          # Rule of Two: this job holds a write token or publish secret, so it
          # never restores a cache an issue-triggered job could have written.
          no-cache: true
      # WF-GATE-DEDUP (FC-88): no `bun run typecheck` and no `bun test` here.
      # The Tests workflow already runs tsc (test.yml "Typecheck loki-ts (tsc)")
      # and the impacted bun suites on this tree, and required-ci below makes `release`
      # wait for that verdict (or the bump-only parent's, FC-70). This job did
      # the same work again in 6m40s (run 37859034694). It keeps only what Tests
      # cannot know: the dist committed at the release SHA is what a fresh build
      # of that SHA produces (debugId aside), and so is the dist in the tarball.
      # Do NOT re-add `bun test`; tests/test-release-gate-dedup.sh fails on it.
      - name: Verify the committed loki-ts dist is a fresh build of this SHA
        run: |
          bun install --cwd loki-ts --frozen-lockfile
          bash scripts/ci/verify-release-dist.sh build
      - name: Verify the dist inside the npm tarball matches the committed dist
        run: |
          set -euo pipefail
          tgz="$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          bash scripts/ci/verify-release-dist.sh tarball "$RUNNER_TEMP/$tgz"
      - name: Byte-compile the two version-stamped Python modules
        # No pip install needed for a syntax/import-surface check; ubuntu-latest
        # ships a system python3. dashboard/__init__.py and mcp/__init__.py
        # carry __version__ = "X.Y.Z" and got zero execution here once the
        # pytest step was removed -- this is the cheap replacement floor.
        run: python3 -m py_compile dashboard/__init__.py mcp/__init__.py
      - name: Version-bump file consistency (server.json, plugin.json track VERSION)
        # Pure bash + stdlib python3 json, no pip install. These are also part
        # of the sharded shell-tests suite inside "Tests", but running them
        # here too means a metadata-only release is checked at ITS OWN commit
        # even on the iteration where required-ci reuses the parent's verdict
        # for Tests.
        run: |
          bash tests/test-server-json-current.sh
          bash tests/test-plugin-json-current.sh

  # PROPORTIONAL CI: reuse the PARENT commit's verdict for Tests
  # when this push is a version-bump-only diff against an explicit allowlist;
  # otherwise, PROPORTIONAL CI AT THE EXACT RELEASE SHA, as before.
  #
  # S-84 (2026-09): "a release becomes a lookup". A VERSION-only bump whose
  # parent commit already has a green Tests run no longer waits
  # ~26-34 min for those to re-run at the release SHA -- it looks up that
  # parent's already-completed verdict instead. This job no longer `needs:
  # gate`; the two run in parallel, since gate's own checks (bash syntax, dist
  # rebuild and tarball match, the two version-file probes) are independent of this
  # lookup. `release` still needs both.
  #
  # GUARANTEED, exactly: for each of Tests / Security Audit,
  # (a) any success at the release SHA wins outright; (b) else any completed
  # run at the release SHA with conclusion exactly "failure" fails the whole
  # job, even if another run of the same workflow is still in flight (a
  # completed failure is never hidden behind a hopeful retry); (c) else, for
  # Tests/Security Audit, reuse the parent's verdict if this push is eligible
  # (see below) and the parent shows a success; (d) else wait for the release
  # SHA's own result. Security Audit reuses the parent's newest decisive verdict under the SAME
  # eligibility rule (E-157), only when that verdict is success AND a pinned
  # gitleaks scan of PARENT..SHA (second-parent commits included) is clean,
  # because the allowlist admits bytes the parent's audit never scanned.
  # Eligibility (the "(c)" gate) requires every file this push changed to be
  # on the allowlist below, present as the same regular-file mode on both
  # sides (round 3: `git diff --raw`, not `--name-only` -- a rename, add,
  # delete, or mode/type change disqualifies even an allowlisted path), AND
  # each changed file's own RAW BYTES normalize to identical once the old and
  # new VERSION literal (each required to match `^\d+\.\d+\.\d+$`, round 3) is
  # substituted for a placeholder -- CHANGELOG.md instead has to be an
  # insert-only edit (round 3.1: exactly one new block, opening with
  # "## v<NEW_VERSION>", inserted immediately before the parent's own first
  # "## v<OLD_VERSION>" heading, with the shared header above it and every
  # existing entry below it byte-for-byte unchanged -- a plain "old bytes are
  # a suffix of new" check rejected every real release here, because this
  # repo's CHANGELOG.md keeps one shared header above all entries rather than
  # repeating it per release). A file that fails its check disqualifies reuse for
  # everything, not just itself. This is a fail-closed eligibility gate, not a
  # substitute for (b): a completed failure at the release SHA always wins
  # over reuse, and reuse never wins over a success or failure already
  # decided at the release SHA itself.
  #
  # Round 3 (two independent HIGH reviews of round 2, both reproduced):
  #
  # FIX 1 (byte-safe compare). Round 2's compare split each file with
  # `str.splitlines()` (which treats \r, \x0c, U+2028 and others as line
  # breaks) and rejoined with "\n", then substituted the version string.
  # Reviewers reproduced hiding a Dockerfile `USER nobody` (so the built image
  # ran as root, confirmed with `docker build`) and a Python `raise` guard in
  # mcp/__init__.py, in both cases by swapping the `\n` before it for a `\r`
  # or U+2028 -- the normalizer's own line reshuffle made the parent and the
  # sabotaged release compare equal. Fixed by comparing RAW BYTES with a
  # single substring substitution and no line splitting at all; a NUL already
  # present on either side (which would collide with the placeholder) now
  # disqualifies that file outright. The debugId trailer strip is scoped to
  # loki-ts/dist/loki.js alone, matched only at the true end of the byte
  # string (never mid-file, never on another path), so it cannot be used to
  # smuggle a line into any other allowlisted file either.
  #
  # FIX 2 (release-SHA priority, corrected). Round 2 treated ANY non-success
  # completed run at the release SHA (including cancelled/timed_out) as an
  # immediate fail. Reviewers showed this fails an otherwise-eligible, fully
  # green bump the moment a later push's `cancel-in-progress` concurrency
  # group cancels the release SHA's own in-flight Tests run -- a false
  # negative, not a safety property. The (a)-(b)-(c)-(d) order above is the
  # fix: only an explicit completed "failure" blocks reuse; cancelled,
  # timed_out, or skipped fall through to reuse-if-eligible or to waiting,
  # exactly like "not resolved yet". Checking (b) before waiting on any
  # still-in-flight retry is what closes the "hidden failure" case: a
  # completed failure plus a still-running run no longer reports pending.
  #
  # loki-ts/dist/loki.js.map is back on the allowlist (round 3): round 2's
  # diagnosis for why a real release's dist failed to reuse -- non-deterministic
  # minifier variable naming -- was WRONG, per both reviewers' independent,
  # measured correction. Bun's build is byte-deterministic per commit; the
  # committed b651b98d^ dist was simply STALE relative to its own src at that
  # commit, which a fresh rebuild in a scratch worktree confirmed (see the
  # replay note below). The map's JSON "debugId" is derived from the bundle
  # (which embeds VERSION), so leaving the map off the allowlist made reuse
  # permanently dead: 39 of the last 40 release commits touch it. Fixed
  # properly instead of exempted: parse the map as JSON, drop only the
  # top-level "debugId" key from each side, canonically re-serialize what's
  # left, and run the same raw version-literal compare on that. A stale or
  # rebuilt-different parent dist still correctly makes the bump ineligible;
  # only a genuinely fresh, matching parent dist reuses.
  #
  # That is not hypothetical for this repo: a releases test passed on a
  # developer clone and failed on 3.10-3.13 in Actions, and the operator mount
  # failed open on exactly those versions. Neither was visible to a 3.12-only
  # gate (which is why `gate` no longer runs pytest at all -- see its comment).
  #
  # This job deliberately polls the check-runs API rather than adding matrix
  # jobs here: re-running the matrix inside release.yml would verify a
  # DIFFERENT execution than the one the branch was judged on, and doubles CI
  # cost for a weaker guarantee.
  #
  # FAIL-CLOSED DIRECTION IS LOAD-BEARING throughout: an absent measurement,
  # a still-queued run, or an ineligible/unreadable diff never counts as a
  # pass -- each either falls back to checking the release SHA directly or
  # keeps the job waiting up to the poll deadline, and the deadline itself
  # fails closed. The reuse fast path also depends on the parent's Tests/Bun
  # Parity having actually finished before the bump was pushed -- main's
  # `cancel-in-progress` concurrency group would otherwise cancel an in-flight
  # parent run when the bump lands; S-80 (per-SHA concurrency, approved
  # separately) removes that cancellation risk. It does not need to land for
  # FIX 2 above: FIX 2 is about a cancelled run at the RELEASE SHA, a
  # different commit than the one S-80 protects.
  required-ci:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      actions: read
      contents: read
    steps:
      - name: Checkout (full history for the reuse-eligibility diff and the PARENT..SHA secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        # E-157: reusing the parent's Security Audit verdict needs a fresh scan of
        # PARENT..SHA first (see the poll loop). Same pinned binary as the audit.
        run: bash scripts/install-gitleaks.sh

      - name: Require Tests / Security Audit green, at the release SHA or an eligible parent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WAIVER_FROM: ${{ vars.LOKI_CI_WAIVER_FROM }}
          WAIVER_COUNT: ${{ vars.LOKI_CI_WAIVER_COUNT }}
        run: |
          set -euo pipefail

          # D88 CI waiver (founder, 2026-10-03: "skip all CIs for next 10
          # releases"). Active only while both repo variables are set: the
          # release does not wait for Tests / Security Audit when
          # fewer than WAIVER_COUNT release tags exist above WAIVER_FROM. It
          # expires by itself after WAIVER_COUNT releases; unset the variables
          # to end it early.
          if [ -n "${WAIVER_FROM:-}" ] && [ -n "${WAIVER_COUNT:-}" ]; then
            CUR="$(tr -d '[:space:]' < VERSION)"
            if [ "$CUR" != "$WAIVER_FROM" ] && [ "$(printf '%s\n%s\n' "$WAIVER_FROM" "$CUR" | sort -V | tail -1)" = "$CUR" ]; then
              USED=0
              for t in $(git tag --list 'v[0-9]*'); do
                v="${t#v}"
                [ "$v" = "$WAIVER_FROM" ] && continue
                [ "$v" = "$CUR" ] && continue
                [ "$(printf '%s\n%s\n' "$WAIVER_FROM" "$v" | sort -V | tail -1)" = "$v" ] || continue
                [ "$(printf '%s\n%s\n' "$v" "$CUR" | sort -V | tail -1)" = "$CUR" ] || continue
                USED=$((USED + 1))
              done
              if [ "$USED" -lt "$WAIVER_COUNT" ]; then
                echo "D88 CI WAIVER: v$CUR is waived release $((USED + 1)) of $WAIVER_COUNT after v$WAIVER_FROM; not waiting for Tests / Security Audit."
                exit 0
              fi
              echo "D88 CI waiver exhausted ($USED of $WAIVER_COUNT used); full required-ci applies."
            fi
          fi

          # -------------------------------------------------------------------
          # STEP 1: is this a version-bump-only diff against the immediate
          # parent? The parent must resolve and this must be a push event
          # (workflow_dispatch republishes an already-tagged commit and always
          # checks fresh). Everything else -- the allowlist, the raw-mode
          # check, the VERSION shape, and the per-file byte compare -- is
          # decided in one python3 invocation below (round 3: rewritten for
          # BLOCKING findings A and B from two independent HIGH reviews of
          # round 2; see the job-level comment above for what each fixes).
          # -------------------------------------------------------------------
          ELIGIBLE=0
          PARENT=""
          if [ "$EVENT_NAME" = "push" ] && PARENT="$(git rev-parse "${SHA}^" 2>/dev/null)" \
             && git cat-file -e "${PARENT}^{commit}" 2>/dev/null; then
            if python3 - "$PARENT" "$SHA" <<'PYEOF'
          import json, re, subprocess, sys

          parent, sha = sys.argv[1], sys.argv[2]

          # One per line, NO leading whitespace (see the job comment for what
          # each path's own check additionally requires beyond being listed
          # here: CHANGELOG.md is prepend-only; loki.js and loki.js.map each
          # have their own debugId handling; everything else is a plain raw
          # version-literal byte compare).
          ALLOWLIST = {
              "VERSION", "package.json", "SKILL.md", "CHANGELOG.md", "CLAUDE.md",
              "docker/Dockerfile", "docker/Dockerfile.sandbox", "dashboard/__init__.py",
              "mcp/__init__.py", "server.json",
              "plugins/loki-mode/.claude-plugin/plugin.json",
              "loki-ts/dist/loki.js", "loki-ts/dist/loki.js.map",
              "docs/INSTALLATION.md", "wiki/Home.md", "wiki/_Sidebar.md",
              "wiki/API-Reference.md", "web-app/src/components/Footer.tsx",
              "web-app/src/components/WhatsNew.tsx",
              "helm/loki-mode/Chart.yaml", "deploy/helm/autonomi/Chart.yaml",
              "deploy/helm/control-plane/Chart.yaml", "docs/CLI-REFERENCE.md",
          }
          REGULAR_MODES = {"100644", "100755"}
          VERSION_RE = re.compile(rb"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$")
          # Anchored at the true end of the byte string ONLY (no MULTILINE):
          # this can match at most once, at the last line, so it can never be
          # used to splice a hidden line in anywhere else in the file.
          DEBUG_ID_TRAILER = re.compile(rb"(?:\r\n|\r|\n)?//# debugId=[0-9A-Fa-f-]+[ \t]*(?:\r\n|\r|\n)?\Z")
          CHANGELOG_HEADING = re.compile(rb"(?m)^## v")

          def fail(msg):
              print("normalizer: " + msg, file=sys.stderr)
              sys.exit(1)

          def show_bytes(rev, path):
              r = subprocess.run(["git", "show", f"{rev}:{path}"], capture_output=True)
              return r.stdout if r.returncode == 0 else None

          # git diff --raw, NOT --name-only: every changed path must be a
          # status-M, same-mode, regular-file change present on both sides.
          # --no-renames turns a rename into a delete+add pair, which fails
          # the "present on both sides as M" check by construction, so a
          # rename INTO the allowlist (e.g. CHANGELOG.md -> wiki/Home.md)
          # cannot slip through as if it were an ordinary edit.
          raw = subprocess.run(["git", "diff", "--no-renames", "--raw", parent, sha],
                                capture_output=True)
          if raw.returncode != 0:
              fail("git diff --raw failed")
          lines = [l for l in raw.stdout.decode("utf-8", "replace").splitlines() if l]
          if not lines:
              fail("empty diff")
          line_re = re.compile(r'^:(\d+) (\d+) [0-9a-f]+ [0-9a-f]+ ([A-Z])\d*\t(.+)$')
          changed = []
          for line in lines:
              m = line_re.match(line)
              if not m:
                  fail(f"unparseable raw diff line: {line!r}")
              old_mode, new_mode, status, path = m.groups()
              if path not in ALLOWLIST:
                  fail(f"not on the allowlist: {path}")
              if status != "M":
                  fail(f"not a modification (status {status}): {path}")
              if old_mode != new_mode or old_mode not in REGULAR_MODES:
                  fail(f"not a same-mode regular file: {path} ({old_mode} -> {new_mode})")
              changed.append(path)

          old_ver = show_bytes(parent, "VERSION")
          new_ver = show_bytes(sha, "VERSION")
          if old_ver is None or new_ver is None:
              fail("VERSION missing on one side")
          old_ver, new_ver = old_ver.strip(), new_ver.strip()
          if not VERSION_RE.match(old_ver) or not VERSION_RE.match(new_ver):
              fail("VERSION does not match ^\\d+\\.\\d+\\.\\d+$ on one side")

          def version_only(old_b, new_b):
              # A NUL already present on either side would collide with the
              # substitution placeholder and falsely compare equal -- refuse
              # outright rather than risk that collision.
              if b"\x00" in old_b or b"\x00" in new_b:
                  return False
              return old_b.replace(old_ver, b"\x00") == new_b.replace(new_ver, b"\x00")

          for path in changed:
              old_b, new_b = show_bytes(parent, path), show_bytes(sha, path)
              if old_b is None or new_b is None:
                  fail(f"could not read {path} on one side")

              if path == "CHANGELOG.md":
                  # Insert-only: real entries are prepended AFTER a shared
                  # header (title + Keep-a-Changelog blurb), not at byte 0, so
                  # a plain "old is a suffix of new" check rejects every real
                  # release. Instead: locate the parent's FIRST "## v" heading
                  # (line-anchored) -- everything before it is the header,
                  # everything from it onward is the old entries, and BOTH
                  # must appear byte-for-byte unchanged in the new file, with
                  # exactly one inserted block between them. That block must
                  # itself open with "## v<NEW_VERSION>", and it is
                  # immediately followed by the parent's old first heading
                  # ("## v<OLD_VERSION>") by construction of the slice below.
                  m = CHANGELOG_HEADING.search(old_b)
                  if not m:
                      fail("CHANGELOG.md has no '## v' heading to anchor the insert-only check")
                  old_header, old_rest = old_b[:m.start()], old_b[m.start():]
                  if not old_rest.startswith(b"## v" + old_ver):
                      fail("CHANGELOG.md's first heading does not match VERSION")
                  if not (new_b.startswith(old_header) and new_b.endswith(old_rest)
                          and len(new_b) >= len(old_header) + len(old_rest)):
                      fail("CHANGELOG.md is not insert-only (header or existing entries changed)")
                  inserted = new_b[len(old_header):len(new_b) - len(old_rest)]
                  if not inserted.startswith(b"## v" + new_ver):
                      fail("CHANGELOG.md's inserted block does not open with the new version heading")
                  continue

              if path == "loki-ts/dist/loki.js":
                  old_b = DEBUG_ID_TRAILER.sub(b"", old_b, count=1)
                  new_b = DEBUG_ID_TRAILER.sub(b"", new_b, count=1)
                  if not version_only(old_b, new_b):
                      fail("loki.js changed beyond the version string and its debugId trailer")
                  continue

              if path == "loki-ts/dist/loki.js.map":
                  try:
                      old_j, new_j = json.loads(old_b), json.loads(new_b)
                  except Exception as e:
                      fail(f"loki.js.map is not valid JSON: {e}")
                  if not isinstance(old_j, dict) or not isinstance(new_j, dict):
                      fail("loki.js.map is not a JSON object")
                  # E-157: the dropped debugId must be the same hex/dash shape as the
                  # JS trailer, never free-form bytes the parent audit did not scan.
                  for j in (old_j, new_j):
                      d = j.pop("debugId", None)
                      if d is not None and not (isinstance(d, str) and re.fullmatch(r"[0-9A-Fa-f-]+", d)):
                          fail("loki.js.map debugId is not hex/dash shaped")
                  old_canon = json.dumps(old_j, sort_keys=True, separators=(",", ":")).encode()
                  new_canon = json.dumps(new_j, sort_keys=True, separators=(",", ":")).encode()
                  if not version_only(old_canon, new_canon):
                      fail("loki.js.map changed beyond the version string (top-level debugId excluded)")
                  continue

              if not version_only(old_b, new_b):
                  fail(f"{path} changed beyond the version string")

          sys.exit(0)
          PYEOF
            then
              ELIGIBLE=1
            fi
          fi

          if [ "$ELIGIBLE" = "1" ]; then
            echo "Version-bump-only diff against parent $PARENT (every changed file is allowlisted, same-mode, and byte-identical modulo the version string). Tests may reuse that commit's verdict if it already succeeded there; Security Audit follows the same rule (E-157): a decisive run at $SHA wins, else the parent's newest decisive audit verdict is reused only if it is success."
          else
            echo "Not eligible for parent reuse (see 'normalizer:' diagnostic above if the eligibility check ran, or: empty diff, no resolvable parent, or a non-push event). All required workflows must succeed at $SHA unless already decided by a completed run there."
          fi

          # -------------------------------------------------------------------
          # STEP 2: poll. Workflow names, ONE per line, NO leading whitespace:
          # matched with an exact awk field comparison below, so an indented or
          # partial-match entry would never match and the loop would stall
          # until the deadline.
          #
          # "Security Audit" is required here, and security-audit.yml runs on
          # every push to main, train/** and slice-* (E-157), so it actually RUNS at a
          # release commit. Requiring a workflow that never fires at this SHA
          # would deadlock every release rather than gate it, so the trigger
          # and this list must be changed together.
          # -------------------------------------------------------------------
          REQUIRED=$(printf '%s\n' "Tests" "Security Audit")

          fetch_runs() {
            # name<TAB>status<TAB>conclusion<TAB>created_at, one run per line.
            # Push runs only, EXCEPT Security Audit, which also accepts a
            # workflow_dispatch run (E-87: lets a tree whose VERSION is already
            # bumped publish after an audit fix, since a VERSION push cannot be
            # re-created). Tests stays push-only. D75: a Security
            # Audit run counts only if head_branch is main or it was a dispatch,
            # because a train/** run scans only its range and must never stand
            # in for the full-history scan (also covers the parent reuse path). A pull_request
            # run at the same head_sha tested a different merge ref and must
            # never satisfy this.
            gh api "repos/$REPO/actions/runs?head_sha=$1&per_page=100" \
              --jq '.workflow_runs[] | select(.event=="push" or (.event=="workflow_dispatch" and .name=="Security Audit")) | select(.name!="Security Audit" or .head_branch=="main" or .event=="workflow_dispatch") | "\(.name)\t\(.status)\t\(.conclusion)\t\(.created_at)"' 2>/dev/null || true
          }

          audit_verdict() {
            # $1 = runs blob. Prints the conclusion (success|failure) of the
            # NEWEST decisive Security Audit run, so an older success can never
            # mask a newer failure; prints nothing when none is decisive. A
            # created_at tie resolves to failure (fail closed).
            printf '%s\n' "$1" | awk -F'\t' \
              '$1=="Security Audit" && $2=="completed" && ($3=="success"||$3=="failure"){ if ($4>t || ($4==t && $3=="failure")) {t=$4; c=$3} } END{print c}'
          }

          has_conclusion() {
            # $1 = exact workflow name, $2 = runs blob, $3 = exact conclusion.
            # True iff some completed run of that exact name has that exact
            # conclusion, whatever else exists for the same name (a failed run
            # plus a later success still lets has_conclusion(..., success)
            # come back true; a failed run plus a still-running one still lets
            # has_conclusion(..., failure) come back true).
            printf '%s\n' "$2" | awk -F'\t' -v w="$1" -v c="$3" \
              '$1==w && $2=="completed" && $3==c{f=1} END{exit !f}'
          }

          # E-157: the eligibility allowlist accepts bytes the parent's audit never
          # scanned (the CHANGELOG block, a merge release's second-parent history).
          # So the parent's Security Audit verdict is reused ONLY when a pinned
          # gitleaks scan of PARENT..SHA finds nothing. Reuses
          # scripts/security-audit-gitleaks.sh for config trust: the BASE release
          # tag's .gitleaks.toml (or defaults), never the tip's, refusing a changed
          # one. The scan runs at most once; any failure means "do not reuse".
          RANGE_SCAN=""
          range_scan_clean() {
            if [ -z "$RANGE_SCAN" ]; then
              RANGE_SCAN=dirty
              if GITLEAKS_BIN="${GITLEAKS_BIN:-$HOME/.local/share/loki/bin/gitleaks-8.30.0}" \
                 GITLEAKS_BEFORE="$PARENT" GITLEAKS_TIP="$SHA" \
                 GITLEAKS_RANGE="${PARENT}..${SHA}" \
                 GITLEAKS_REPORT="$(mktemp "${TMPDIR:-/tmp}/loki-range-scan.XXXXXX")" \
                 bash "${GITHUB_WORKSPACE:-.}/scripts/security-audit-gitleaks.sh" >&2; then
                RANGE_SCAN=clean
              else
                echo "  Security Audit: PARENT..SHA scan did not come back clean; not reusing the parent's verdict" >&2
              fi
            fi
            [ "$RANGE_SCAN" = "clean" ]
          }

          # D75: the daily scheduled Security Audit run is the full-history
          # authority for what train/** pushes only scanned by range. The newest
          # COMPLETED scheduled run on main blocks the release when it is not a
          # success (failure, cancelled, timed_out, null: a cancelled or
          # timed-out daily scan covered nothing and must be reviewed, never
          # ignored), UNLESS a SUCCESSFUL full-history run on main (event push
          # or workflow_dispatch, head_branch main) was created after it: a main
          # push always runs the full scan, so that success supersedes the stale
          # scheduled verdict and a fixed tree can release. A main push can clear
          # the red even when its npm and python audits were reused via E-160,
          # because secret-scan on main never reuses (D75). A success on a
          # train/** branch never clears it (range scan only).
          # D75b: two queries, never one page of mixed events. (a) the newest
          # scheduled run is fetched on its own (event=schedule, per_page=1), so
          # it cannot fall off a page crowded by main pushes; "no scheduled run"
          # passes ONLY when that query's total_count is 0. (b) newer successes
          # come from status=success, created>=the scheduled run; if none of the
          # fetched ones qualifies but total_count says more exist, the verdict is
          # indeterminate and blocks.
          # Fail closed: a gh error (retried 3 times, e.g. a 404 after a
          # workflow rename) blocks the release.
          sched_audit_api() {
            # $1 = query string, $2 = jq program. Retries; returns 1 on persistent error.
            local i out
            for i in 1 2 3; do
              if out="$(gh api "repos/$REPO/actions/workflows/security-audit.yml/runs?$1" --jq "$2" 2>/dev/null)"; then
                printf '%s\n' "$out"
                return 0
              fi
              sleep 5
            done
            return 1
          }
          sched_audit_fetch() {
            # One line: none | indeterminate | green|cleared|red|indeterminate<TAB>conclusion<TAB>url<TAB>created_at
            # "none" needs an explicit total_count of 0 AND no runs; a response without total_count is never read as zero runs. per_page=1 relies on GitHub returning workflow runs newest first (verified live 2026-10-03).
            local s concl created found
            s="$(sched_audit_api 'event=schedule&branch=main&status=completed&per_page=1' \
              'if (.total_count == 0 and ((.workflow_runs // []) | length) == 0) then "none"
               else ((.workflow_runs // []) | map(select(.event=="schedule" and .head_branch=="main" and .status=="completed")) | first) as $s
                 | if $s == null then "indeterminate" else "\($s.conclusion)\t\($s.html_url)\t\($s.created_at)" end
               end')" || return 1
            case "$s" in
              none | indeterminate) printf '%s\n' "$s"; return 0 ;;
            esac
            concl="$(printf '%s' "$s" | cut -f1)"
            if [ "$concl" = "success" ]; then
              printf 'green\t%s\n' "$s"
              return 0
            fi
            created="$(printf '%s' "$s" | cut -f3)"
            found="$(sched_audit_api "branch=main&status=success&created=%3E%3D${created}&per_page=100" \
              '([(.workflow_runs // [])[] | select(.conclusion=="success" and (.event=="push" or .event=="workflow_dispatch") and .head_branch=="main" and .created_at > "'"$created"'")] | length) as $n
               | if $n > 0 then "cleared"
                 elif (.total_count // 0) > ((.workflow_runs // []) | length) then "indeterminate"
                 else "red" end')" || return 1
            printf '%s\t%s\n' "$found" "$s"
          }
          sched_audit_ok() {
            # $1 = line from sched_audit_fetch. Prints the reason; returns 0 to pass.
            local state concl url created
            state="$(printf '%s' "$1" | cut -f1)"
            concl="$(printf '%s' "$1" | cut -f2)"
            url="$(printf '%s' "$1" | cut -f3)"
            created="$(printf '%s' "$1" | cut -f4)"
            case "$state" in
              none) echo "no completed scheduled run on main (total_count 0); not blocking"; return 0 ;;
              green) echo "newest scheduled run succeeded ($created)"; return 0 ;;
              cleared) echo "newest scheduled run concluded '$concl' ($created, $url) but a newer successful full-history run on main supersedes it"; return 0 ;;
              red) echo "newest scheduled run on main concluded '$concl' ($created, $url) and no newer successful main run supersedes it; review it before releasing"; return 1 ;;
              indeterminate) echo "indeterminate: the scheduled run or the newer successes could not be fully read ($url); blocking"; return 1 ;;
              *) echo "unreadable scheduled Security Audit verdict '$state'"; return 1 ;;
            esac
          }
          sched_audit_gate() {
            local line
            if ! line="$(sched_audit_fetch)"; then
              echo "cannot read scheduled Security Audit runs (API error)"
              return 1
            fi
            sched_audit_ok "$line"
          }
          sched_reason="$(sched_audit_gate)" && sched_rc=0 || sched_rc=$?
          echo "  Security Audit (daily schedule): $sched_reason"
          if [ "$sched_rc" -ne 0 ]; then
            echo "FAIL: the daily scheduled Security Audit is not green"
            exit 1
          fi

          deadline=$(( $(date +%s) + 2400 ))
          while :; do
            runs_release="$(fetch_runs "$SHA")"
            runs_parent=""
            [ "$ELIGIBLE" = "1" ] && runs_parent="$(fetch_runs "$PARENT")"

            pending=0
            failed=0
            while IFS= read -r want; do
              [ -n "$want" ] || continue
              # FIX 2 (round 3, reviewer-corrected priority order):
              #   (a) any success at the release SHA wins outright;
              #   (b) else a completed run at the release SHA with conclusion
              #       exactly "failure" fails the job -- checked BEFORE any
              #       wait, so a still-running retry can never hide it;
              #   (c) else reuse the parent's success if this bump is
              #       eligible (Security Audit too, E-157, via its newest
              #       decisive parent verdict);
              #   (d) else wait for the release SHA's own result. Cancelled,
              #       timed_out, and skipped deliberately fall through to (c)
              #       or (d) rather than failing here: they are not evidence
              #       the code is broken, only that this exact run did not
              #       finish, and treating them as a hard fail would break an
              #       otherwise-green bump whenever a later push's
              #       cancel-in-progress concurrency group cancels the
              #       release SHA's own in-flight run.
              if [ "$want" = "Security Audit" ]; then
                # E-157: same rule as Tests. A decisive verdict at
                # the release SHA always wins; only when none exists does an
                # eligible bump reuse the parent's NEWEST decisive verdict,
                # and only if that verdict is success (a newer parent failure
                # masks an older parent success, so it never reuses).
                label="$SHA"
                case "$(audit_verdict "$runs_release")" in
                  success) result="success" ;;
                  failure) result="failed" ;;
                  *)
                    if [ "$ELIGIBLE" = "1" ] \
                       && [ "$(audit_verdict "$runs_parent")" = "success" ] \
                       && range_scan_clean; then
                      result="success"; label="$PARENT (reused)"
                    else
                      result="pending"
                    fi
                    ;;
                esac
              elif has_conclusion "$want" "$runs_release" success; then
                result="success"; label="$SHA"
              elif has_conclusion "$want" "$runs_release" failure; then
                result="failed"; label="$SHA"
              elif [ "$ELIGIBLE" = "1" ] \
                   && has_conclusion "$want" "$runs_parent" success; then
                result="success"; label="$PARENT (reused)"
              else
                result="pending"; label="$SHA"
              fi
              echo "  $want @ $label: $result"
              case "$result" in
                success) ;;
                pending) pending=1 ;;
                failed) failed=1 ;;
              esac
            done <<<"$REQUIRED"

            if [ "$failed" -eq 1 ]; then
              echo "FAIL: a required workflow did not succeed"
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All required workflows succeeded"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "FAIL: required workflows did not complete before the deadline"
              exit 1
            fi
            sleep 10
          done

  release:
    runs-on: ubuntu-latest
    needs: [gate, required-ci]
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      release_created: ${{ steps.check_release.outputs.release_exists == 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release artifacts
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          mkdir -p release

          # ============================================
          # Artifact 1: loki-mode.zip (for Claude.ai website)
          # SKILL.md at ROOT level for direct upload
          # ============================================
          mkdir -p release/skill-root
          cp SKILL.md release/skill-root/
          cp -r references release/skill-root/

          cd release/skill-root
          zip -r ../loki-mode-${{ steps.version.outputs.version }}.zip .
          cd ../..

          # Also create .skill file (same as zip, different extension)
          cp release/loki-mode-${{ steps.version.outputs.version }}.zip release/loki-mode-${{ steps.version.outputs.version }}.skill

          # ============================================
          # Artifact 2: loki-mode-api.zip (for console.anthropic.com)
          # SKILL.md inside loki-mode/ folder (API requires folder wrapper)
          # ============================================
          mkdir -p release/api-package/loki-mode
          cp SKILL.md release/api-package/loki-mode/
          cp -r references release/api-package/loki-mode/

          cd release/api-package
          zip -r ../loki-mode-api-${{ steps.version.outputs.version }}.zip loki-mode
          cd ../..

          # ============================================
          # Artifact 3: loki-mode-claude-code.zip
          # For Claude Code: full package with loki-mode/ folder
          # Extract to ~/.claude/skills/
          # ============================================
          mkdir -p release/loki-mode
          cp SKILL.md release/loki-mode/
          cp README.md release/loki-mode/
          cp LICENSE release/loki-mode/ 2>/dev/null || true
          cp VERSION release/loki-mode/
          cp CHANGELOG.md release/loki-mode/
          cp -r references release/loki-mode/
          cp -r examples release/loki-mode/
          cp -r tests release/loki-mode/
          cp -r scripts release/loki-mode/
          cp -r autonomy release/loki-mode/
          cp -r dashboard release/loki-mode/
          cp -r memory release/loki-mode/
          cp -r skills release/loki-mode/
          cp -r providers release/loki-mode/
          cp -r events release/loki-mode/
          cp -r templates release/loki-mode/
          cp -r learning release/loki-mode/
          cp -r mcp release/loki-mode/
          cp -r completions release/loki-mode/
          cp -r integrations release/loki-mode/

          cd release
          zip -r loki-mode-claude-code-${{ steps.version.outputs.version }}.zip loki-mode
          tar -czvf loki-mode-claude-code-${{ steps.version.outputs.version }}.tar.gz loki-mode
          cd ..

      # THE NPM-TARBALL SBOM IS GENERATED HERE, NOT IN sbom.yml, FOR THE SAME
      # REASON THE CONTAINER SBOM IS GENERATED IN publish-docker (see :576-591).
      #
      # sbom.yml has a `release: published` trigger that has NEVER fired. This
      # release is created by `gh release create` below under the default
      # GITHUB_TOKEN, and GitHub suppresses trigger events for that token to
      # prevent workflow recursion -- measured over sbom.yml's last 15 runs,
      # every one was `push`, none was `release`. So every release ever cut has
      # shipped with zero SBOM assets while a green workflow claimed otherwise.
      # A dead trigger shows as an EMPTY run list, never a red one.
      #
      # It must run BEFORE `gh release create`, not after: releases here are
      # immutable and a post-publish upload fails HTTP 422 (:293-297).
      #
      # This SBOM describes the npm TARBALL. publish-docker generates a
      # SEPARATE image-sbom.cdx.json describing the CONTAINER, which carries an
      # OS layer and Python runtime the npm tree never lists. They are NOT
      # interchangeable, which is why the filenames differ -- a collision would
      # silently overwrite one and ship half the evidence the release claims.
      - name: Setup Node.js (for SBOM generation)
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate npm-tarball SBOM (CycloneDX)
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          # Describe what users actually receive from `npm install`, so pack
          # the tarball and resolve deps inside it rather than in the source
          # tree. --omit dev twice: the published tarball declares
          # devDependencies but does not ship them, and cyclonedx-npm's
          # `npm ls --all` errors ELSPROBLEMS on the missing ones.
          npm pack
          mkdir -p /tmp/published
          tar xzf loki-mode-*.tgz -C /tmp/published
          cd /tmp/published/package
          npm install --omit=dev --no-package-lock
          npx --yes @cyclonedx/cyclonedx-npm \
            --omit dev \
            --output-format JSON \
            --output-file "$GITHUB_WORKSPACE/release/npm-sbom.cdx.json" \
            --spec-version 1.5

      - name: Verify the npm SBOM is non-empty
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          # Fail closed. A zero-byte SBOM asset is WORSE than no asset: it
          # looks like compliance to anyone scanning the release.
          test -s release/npm-sbom.cdx.json || { echo "FATAL: npm SBOM is empty"; exit 1; }
          echo "npm SBOM size: $(wc -c < release/npm-sbom.cdx.json) bytes"

      # E-88 (rework, D36): this step used to run AFTER "Create Git Tag", so a
      # bad or missing CHANGELOG section failed the job only once the tag was
      # already pushed -- burning that version number (never force-move or
      # delete a tag, so it cannot be reused). Extraction now runs first, so a
      # notes failure aborts before anything irreversible happens.
      - name: Extract changelog for this version
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          set -uo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # scripts/release-notes.sh (E-88) replaces the old inline awk here:
          # that awk anchored `/^## v$VERSION$/` against headers written as
          # `## vX.Y.Z (YYYY-MM-DD)`, so it never matched, and it spliced
          # VERSION into an ERE unescaped, so its dots matched any character.
          # Both bugs silently fell back to a one-line "Release vX.Y.Z" body;
          # v9.80.1, v9.81.0, v10.0.1, v10.1.0, v10.1.1 and v10.2.1 shipped
          # that way. The release now FAILS instead of falling back.
          #
          # No --include here (E-88a): carrying another version's notes
          # forward is a manual Release Manager decision written directly
          # into the CHANGELOG entry (as done for 10.0.1 and 10.2.1), never
          # auto-detected from prose or an npm lookup.
          if ! bash scripts/release-notes.sh "$VERSION" > changelog_body.txt; then
            echo "ERROR: CHANGELOG.md has no fully-written release notes for v$VERSION." >&2
            echo "Add a '## v$VERSION' section with '### ' subsections and '- ' bullets before releasing." >&2
            exit 1
          fi

      # S-105: a release that changes workflow files cannot have its tag pushed
      # by GITHUB_TOKEN ("refusing to allow a GitHub App to create or update
      # workflow ... without workflows permission"). The old step echoed
      # "continuing" and gh release create then died on "tag exists locally but
      # has not been pushed" (run 36331009098). Now: a tag already on the remote
      # (pre-pushed by the Release Manager) is reused only if it points at the
      # release SHA; a rejected push with no remote tag fails HERE, loudly.
      # Never --force, never delete a tag. Runs whenever the release is being
      # created (not only when the tag is absent locally) so a pre-pushed tag
      # at the wrong SHA is caught instead of silently released.
      - name: Create Git Tag
        if: steps.check_release.outputs.release_exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          TAG="v${VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          # Commit the remote tag points at (peeled for an annotated tag), or empty.
          remote_tag_sha() {
            local out
            out="$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")" || return 1
            printf '%s\n' "$out" | awk -v p="refs/tags/${TAG}^{}" '$2==p{print $1; f=1} END{if(!f) exit 1}' \
              || printf '%s\n' "$out" | awk -v r="refs/tags/${TAG}" '$2==r{print $1}'
          }
          reuse_or_fail() {
            if [ "$1" = "$RELEASE_SHA" ]; then
              echo "Tag ${TAG} already on remote at release SHA ${RELEASE_SHA}; reusing it."
              git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
                || git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
              exit 0
            fi
            echo "ERROR: tag ${TAG} on remote points at $1, not the release SHA ${RELEASE_SHA}."
            echo "Refusing to release. Never force-move or delete a release tag; bump the version instead."
            exit 1
          }
          if LOCAL_SHA="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")"; then
            if [ "$LOCAL_SHA" != "$RELEASE_SHA" ]; then
              echo "ERROR: local tag ${TAG} points at ${LOCAL_SHA}, not the release SHA ${RELEASE_SHA}."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}" "${RELEASE_SHA}" || exit 1
          fi
          if git push origin "refs/tags/${TAG}"; then
            echo "Pushed tag ${TAG} at ${RELEASE_SHA}."
            exit 0
          fi
          # Rejected. A tag already on the remote (pre-pushed by the Release
          # Manager, before or during this run) is refused client-side, so this
          # one check covers both; reuse it only at the release SHA.
          REMOTE_SHA="$(remote_tag_sha)" || REMOTE_SHA=""
          [ -n "$REMOTE_SHA" ] && reuse_or_fail "$REMOTE_SHA"
          echo "ERROR: pushing tag ${TAG} was rejected and the tag is not on the remote."
          echo "This happens when the release changes .github/workflows/ files: GITHUB_TOKEN lacks"
          echo "the workflows permission. Workaround: the Release Manager pushes the tag with their"
          echo "own credentials, then re-runs this workflow:"
          echo "  git tag -a ${TAG} -m 'Release ${TAG}' ${RELEASE_SHA} && git push origin refs/tags/${TAG}"
          exit 1

      - name: Create GitHub Release
        if: steps.check_release.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # v7.32.1: build the brew source asset HERE and attach it at release
          # creation. Releases in this repo are immutable, so a later job
          # cannot upload assets (v7.32.0 the homebrew bump failed with HTTP 422
          # trying). promote.yml (update-homebrew) downloads the published asset and hashes
          # those exact bytes for the formula.
          REF="v${VERSION}"
          git rev-parse -q --verify "refs/tags/${REF}" >/dev/null || REF="HEAD"
          git archive --format=tar.gz --prefix="loki-mode-${VERSION}/" \
            -o "release/loki-mode-${VERSION}.tar.gz" "${REF}"
          if ! file "release/loki-mode-${VERSION}.tar.gz" | grep -q 'gzip compressed'; then
            echo "ERROR: built brew asset is not a valid gzip tarball"
            exit 1
          fi
          gh release create "v${VERSION}" \
            release/loki-mode-${VERSION}.zip \
            release/loki-mode-${VERSION}.skill \
            release/loki-mode-api-${VERSION}.zip \
            release/loki-mode-${VERSION}.tar.gz \
            release/loki-mode-claude-code-${VERSION}.zip \
            release/loki-mode-claude-code-${VERSION}.tar.gz \
            release/npm-sbom.cdx.json \
            --title "Loki Mode v${VERSION}" \
            --notes-file changelog_body.txt
          # Post-create check (E-88, D36 rework): confirm the published release
          # body is not the old one-line fallback -- belt-and-braces on top of
          # the extract step's own failure, which already guarantees a
          # fully-written body reached --notes-file above, now BEFORE the tag
          # was even created. A hard failure here can only ever fire on a
          # `gh`-side mangling of a body already proven good, yet it runs
          # AFTER gh release create, when downstream jobs (npm, Docker,
          # Homebrew) depend on this job succeeding -- so `exit 1` here
          # orphans an already-created release exactly like the v10.2.0
          # incident this slice exists to prevent. Downgraded to a warning
          # annotation, never removed outright, because it is still real
          # evidence if `gh` itself ever mangles a body: worth seeing in the
          # run log, never worth failing a completed release over.
          BODY=""
          for _attempt in 1 2 3; do
            BODY="$(gh release view "v${VERSION}" --json body --jq .body 2>/dev/null)" && break
            echo "WARNING: gh release view attempt ${_attempt} failed; retrying." >&2
            sleep 2
          done
          if [ -z "$BODY" ]; then
            echo "WARNING: could not read back v${VERSION}'s release body after 3 attempts; skipping the placeholder check (the extract step already validated it before --notes-file)." >&2
          elif [ "$BODY" = "Release v${VERSION}" ]; then
            echo "::warning::published release v${VERSION} body is the placeholder 'Release v${VERSION}' -- the extract step should have caught this before tagging; investigate but the release stands."
          fi

      - name: Skip message
        if: steps.check_release.outputs.release_exists == 'true'
        run: |
          echo "Release v${{ steps.version.outputs.version }} already exists. Skipping."

  notify-slack:
    needs: release
    if: needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_republish == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          # E-88 (rework, D36): this used to be the same buggy inline awk the
          # release job's own extract step replaced (unanchored heading match,
          # VERSION spliced into a regex unescaped). By the time this job
          # runs, `release` has already succeeded, which means its own
          # scripts/release-notes.sh call already validated this version's
          # section -- so a failure here should never happen, but the
          # fallback line stays as defense in depth for a Slack message,
          # never a release gate.
          if ! bash scripts/release-notes.sh "$VERSION" > /tmp/changelog-body.txt; then
            echo "Release v$VERSION" > /tmp/changelog-body.txt
          fi
          # Truncate to 2000 chars for Slack block limit
          head -c 2000 /tmp/changelog-body.txt > /tmp/changelog-truncated.txt
          mv /tmp/changelog-truncated.txt /tmp/changelog-body.txt

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification"
            exit 0
          fi

          VERSION="v${{ needs.release.outputs.version }}"
          RELEASE_URL="https://github.com/asklokesh/loki-mode/releases/tag/${VERSION}"

          # Build Slack payload entirely in Python to avoid bash backtick issues
          VERSION_FOR_SLACK="$VERSION" RELEASE_URL_FOR_SLACK="$RELEASE_URL" python3 -c "
          import json, os

          version = os.environ['VERSION_FOR_SLACK']
          release_url = os.environ['RELEASE_URL_FOR_SLACK']

          # Read changelog from file (avoids bash backtick interpretation)
          with open('/tmp/changelog-body.txt') as f:
              changelog = f.read().strip()

          changelog_safe = changelog
          if len(changelog_safe) > 1500:
              changelog_safe = changelog_safe[:1500] + '...'

          payload = {
              'blocks': [
                  {
                      'type': 'header',
                      'text': {'type': 'plain_text', 'text': f'Loki Mode {version} Released'}
                  },
                  {
                      'type': 'section',
                      'text': {'type': 'mrkdwn', 'text': f'*<{release_url}|View Release on GitHub>*'}
                  },
                  {
                      'type': 'section',
                      'text': {'type': 'mrkdwn', 'text': changelog_safe}
                  },
                  {'type': 'divider'},
                  {
                      'type': 'section',
                      'text': {
                          'type': 'mrkdwn',
                          'text': f'*Ready for website update.* Reply in this thread:\\n>\`@Claude update the autonomi.dev blog for Loki Mode {version}. Read the changelog from https://github.com/asklokesh/loki-mode/blob/main/CHANGELOG.md for {version}, then update src/data/blog-posts.ts in https://github.com/asklokesh/autonomi-website with a new blog post entry. Also update the FALLBACK version in src/hooks/useLatestVersion.ts. No emojis. Commit and push.\`'
                      }
                  }
              ]
          }

          with open('/tmp/slack-payload.json', 'w') as f:
              json.dump(payload, f)
          "

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d @/tmp/slack-payload.json

          echo "Slack notification sent for ${VERSION}"

  publish-npm:
    needs: release
    if: needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_republish == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        # Required so the npm prepack hook can build the loki-ts dist artifact
        # before publishing. Without bun on PATH the prepack falls back to the
        # committed dist (if any) and emits a WARN, which is not desirable for
        # release builds.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          # Rule of Two: this job holds a write token or publish secret, so it
          # never restores a cache an issue-triggered job could have written.
          no-cache: true

      - name: Pack once and verify the PACKED tarball carries a fresh dist
        run: |
          # WHY PACK AND NOT THE WORKTREE. package.json's prepack rebuilds
          # loki-ts/dist DURING pack, so a check against the checked-out tree
          # inspects the PRE-rebuild file. `npm pack` runs that prepack once;
          # the resulting tarball is both what we inspect and what we publish
          # (D90: before, `npm publish` ran prepack a second time, a second
          # full dist build, on top of the pack above it).
          #
          # WHAT THIS CATCHES. prepack SWALLOWS a failed build, so a broken
          # build yields exit 0 and a tarball carrying a STALE dist. The
          # assertion below fails the job before anything is published.
          set -euo pipefail
          want="$(cat VERSION)"
          # prepack's bun build writes to stdout too: take the LAST line, which
          # is the tarball npm reports.
          # `npm pack` skips prepublishOnly and `npm publish <tgz>` runs no
          # scripts, so build the web-app and control-plane dist here, fail closed.
          npm run prepublishOnly
          # FC-51: `npm publish <tgz>` records NO gitHead of its own (only a
          # directory publish reads .git), and promote.yml refuses a version
          # with no gitHead. Stamp the exact release commit into the manifest
          # that gets packed, then restore the tracked file.
          GITHEAD_STAMP="$(git rev-parse HEAD)" || { echo "FATAL: git rev-parse HEAD failed"; exit 1; }
          printf '%s' "$GITHEAD_STAMP" | grep -Eq '^[0-9a-f]{40}$' || { echo "FATAL: HEAD is not a 40-hex SHA: $GITHEAD_STAMP"; exit 1; }
          cp package.json "$RUNNER_TEMP/package.json.orig"
          npm pkg set gitHead="$GITHEAD_STAMP"
          tgz="$(npm pack --silent | tail -n 1)"
          cp "$RUNNER_TEMP/package.json.orig" package.json
          tar -xzOf "$tgz" package/package.json > "$RUNNER_TEMP/packed-package.json"
          PACKED_HEAD="$(node -p "require(process.argv[1]).gitHead || ''" "$RUNNER_TEMP/packed-package.json")"
          [ "$PACKED_HEAD" = "$GITHEAD_STAMP" ] || {
            echo "FATAL: packed package.json gitHead '${PACKED_HEAD}' != HEAD ${GITHEAD_STAMP}"; exit 1; }
          echo "OK: packed manifest gitHead ${PACKED_HEAD}"
          tar -tzf "$tgz" > "$RUNNER_TEMP/tgz.list"
          for need in package/packages/control-plane/dist/server.js \
                      package/packages/control-plane/dist/ask-tools-server.js \
                      package/packages/control-plane/ui/dist/index.html \
                      package/web-app/dist/index.html; do
            grep -qxF "$need" "$RUNNER_TEMP/tgz.list" || { echo "FATAL: packed tarball is missing $need"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/npm-tarball"
          cp "$tgz" "$RUNNER_TEMP/npm-tarball/"
          printf '%s\n' "$tgz" > "$RUNNER_TEMP/npm-tarball/NAME"
          mkdir -p "$RUNNER_TEMP/unpack"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/unpack" package/loki-ts/dist/loki.js
          test -f "$RUNNER_TEMP/unpack/package/loki-ts/dist/loki.js" || {
            echo "FATAL: packed tarball has no loki-ts/dist/loki.js"; exit 1; }
          grep -q "\"${want}\"" "$RUNNER_TEMP/unpack/package/loki-ts/dist/loki.js" || {
            echo "FATAL: packed dist does not embed VERSION ${want}"
            echo "       embedded: $(grep -oE '\"[0-9]+\.[0-9]+\.[0-9]+\"' "$RUNNER_TEMP/unpack/package/loki-ts/dist/loki.js" | sort -u | head -3 | tr '\n' ' ')"
            exit 1; }
          echo "OK: packed dist embeds ${want}"

      - name: Upload the tarball that is published
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          overwrite: true
          path: ${{ runner.temp }}/npm-tarball/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Publish the verified tarball (no rebuild)
        # Publishing a tarball path does not run prepack. publish-npm used to
        # take 8m20s (run 37714923032): 41s was this publish, 7m59s was the
        # registry-visibility wait below, which now lives in its own job.
        run: npm publish "$RUNNER_TEMP/npm-tarball/$(cat "$RUNNER_TEMP/npm-tarball/NAME")" --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # D90: split out of publish-npm so the publish job ends when the publish
  # does. Post-Release Smoke and Promote trigger on this WORKFLOW finishing, so
  # holding this job until the registry serves the exact version still gates
  # both on visibility. Registry lag is external time, reported separately.
  npm-visible:
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout (VERSION only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait until npm serves the published version
        # NPM-LAG: npm can take 30+ minutes to serve a version it just accepted
        # (10.5.34 smoke failed ETARGET during a 29 minute lag and skipped
        # promote). Post-Release Smoke and Promote both trigger on this workflow
        # finishing successfully, so holding THIS job until the registry serves
        # the exact version gates both on visibility: neither can run against a
        # version npm does not serve yet. Three states, never conflated:
        #   visible: npm view prints exactly VERSION, so pass
        #   lagging: empty output, E404 or a transient error, so keep polling;
        #            this is neither a failure nor a pass
        #   timeout: still not visible at the deadline, so fail with the
        #            distinct NPM-LAG-TIMEOUT message
        # --prefer-online bypasses the local packument cache. The smoke and
        # promote retry windows stay as they are; this wait only adds the
        # guarantee in front of them.
        env:
          NPM_WAIT_TIMEOUT_S: '2700'
          NPM_WAIT_BASE_S: '5'
          NPM_WAIT_CAP_S: '60'
        run: |
          set -uo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          deadline=$(( $(date +%s) + NPM_WAIT_TIMEOUT_S ))
          delay="$NPM_WAIT_BASE_S"
          polls=0
          while :; do
            polls=$(( polls + 1 ))
            FOUND="$(npm view "loki-mode@${VERSION}" version --prefer-online 2>/dev/null || true)"
            if [ "$FOUND" = "$VERSION" ]; then
              echo "OK: npm serves loki-mode@${VERSION} (poll ${polls})"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "NPM-LAG-TIMEOUT: loki-mode@${VERSION} still not served by npm after ${NPM_WAIT_TIMEOUT_S}s (${polls} polls); the publish step succeeded but the registry never listed it"
              exit 1
            fi
            echo "poll ${polls}: loki-mode@${VERSION} not visible on npm yet (registry lag, not a failure); sleeping ${delay}s"
            sleep "$delay"
            delay=$(( delay * 2 ))
            [ "$delay" -gt "$NPM_WAIT_CAP_S" ] && delay="$NPM_WAIT_CAP_S"
          done

  publish-python-sdk:
    needs: release
    if: needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_republish == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync version from VERSION file
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "Syncing Python SDK version to $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" sdk/python/pyproject.toml

      - name: Build Python SDK
        working-directory: sdk/python
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install twine
          twine upload dist/*

  publish-ts-sdk:
    needs: release
    if: needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_republish == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version from VERSION file
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "Syncing TypeScript SDK version to $VERSION"
          npm --prefix sdk/typescript pkg set version="$VERSION"

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm install
          npm run build

      - name: Publish to npm
        working-directory: sdk/typescript
        run: npm publish --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # NATIVE PER-ARCH BUILD, NOT QEMU EMULATION (S-85).
  #
  # `docker/build-push-action` with `platforms: linux/amd64,linux/arm64` on a
  # single ubuntu-latest runner built arm64 under QEMU user-mode emulation,
  # which is slow enough to dominate this job's runtime. GitHub-hosted
  # ubuntu-24.04-arm runners build arm64 natively, so each architecture now
  # builds on its own native runner and pushes only its own digest (no tag);
  # the publish-docker job below assembles the two digests into the one
  # multi-arch manifest that carries every tag.
  publish-docker-build:
    needs: release
    if: needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_republish == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun (for loki-ts build before docker context)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          # Rule of Two: this job holds a Docker Hub publish secret, so it
          # never restores a cache an issue-triggered job could have written.
          no-cache: true

      - name: Build loki-ts dist (Dockerfile COPY needs loki-ts/dist/loki.js)
        working-directory: loki-ts
        run: |
          bun install --production
          bun run build
          test -f dist/loki.js || { echo "FATAL: loki-ts/dist/loki.js not built"; exit 1; }
          ls -la dist/

      - name: Set up Docker Buildx (native, no QEMU)
        uses: docker/setup-buildx-action@v3
        with:
          # Rule of Two: this job holds a Docker Hub publish secret, so it
          # never restores a cache an issue-triggered job could have written.
          cache-binary: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.platform }}, native)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=asklokesh/loki-mode,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest" || { echo "FATAL: build step produced no digest"; exit 1; }
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-docker:
    needs: [release, publish-docker-build]
    if: needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_republish == 'true')
    runs-on: ubuntu-latest
    # id-token: write is what makes cosign KEYLESS signing possible -- it mints
    # the short-lived OIDC token that Fulcio exchanges for a signing
    # certificate, so no private key is ever stored or rotated by us. Scoped to
    # this job rather than the workflow: every other job here publishes
    # artifacts and has no business minting identity tokens.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Rule of Two: this job holds a Docker Hub publish secret, so it
          # never restores a cache an issue-triggered job could have written.
          cache-binary: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Version tags only. `:latest` moves in promote.yml after the first-run gate.
      - name: Create and push multi-arch manifest
        id: build
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          tags=(
            "asklokesh/loki-mode:v${{ needs.release.outputs.version }}"
            "asklokesh/loki-mode:${{ needs.release.outputs.version }}"
          )
          tag_args=()
          for t in "${tags[@]}"; do tag_args+=(-t "$t"); done
          sources=()
          for d in *; do sources+=("asklokesh/loki-mode@sha256:${d}"); done
          test "${#sources[@]}" -ge 2 || { echo "FATAL: expected 2 per-arch digests, found ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          # The manifest LIST's own digest (what the registry serves for the
          # tag, and what gets signed below) is the sha256 of the exact bytes
          # `imagetools inspect --raw` returns for it -- content-addressable,
          # so no separate API call to resolve it can race what was just
          # pushed.
          digest="sha256:$(docker buildx imagetools inspect "asklokesh/loki-mode:v${{ needs.release.outputs.version }}" --raw | sha256sum | cut -d' ' -f1)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # SIGNING AND SBOM LIVE HERE, NOT IN provenance.yml, AND THAT IS THE POINT.
      #
      # provenance.yml triggers on `release: published`. Releases in this repo are
      # created by release.yml using the default GITHUB_TOKEN, and GitHub
      # deliberately does not emit trigger events for actions taken with that
      # token -- otherwise a workflow could recursively trigger itself. So
      # provenance.yml has never once fired on a real release: its only two runs
      # ever were manual workflow_dispatch on 2026-04-26, and the registry
      # confirms the consequence -- zero `sha256-*.sig` tags exist on
      # asklokesh/loki-mode despite the header comment in provenance.yml
      # claiming images are signed.
      #
      # A dead workflow shows up as an EMPTY run list, never as a red one, which
      # is why this went unnoticed for months across many releases. Signing in
      # the same job that pushed the image removes the trigger from the equation
      # entirely: if the image published, the signature ran.
      #
      # We sign the DIGEST rather than a tag. Tags are mutable -- `latest` and
      # even a version tag can be repointed -- so a signature bound to a tag
      # attests to whatever that tag happens to mean today. A digest is the
      # content itself. It is the manifest LIST digest: the same one every tag
      # above now resolves to.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign the image digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST" || { echo "FATAL: build step produced no digest"; exit 1; }
          REF="asklokesh/loki-mode@${DIGEST}"
          cosign sign --yes "$REF"
          echo "Signed ${REF}"

      # The SBOM that already existed describes the npm TARBALL. Anyone
      # deploying via Helm or ECS runs the IMAGE, which carries an OS layer, a
      # Python runtime and system packages that the npm SBOM never listed. An
      # enterprise scanning us for CVEs was scanning the wrong artifact.
      - name: Generate image SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: asklokesh/loki-mode@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
          upload-artifact: false

      - name: Attest the SBOM to the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -s image-sbom.cdx.json || { echo "FATAL: SBOM is empty"; exit 1; }
          cosign attest --yes \
            --predicate image-sbom.cdx.json \
            --type cyclonedx \
            "asklokesh/loki-mode@${DIGEST}"
          echo "SBOM attested to asklokesh/loki-mode@${DIGEST}"

      - name: Upload image SBOM as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-sbom-${{ needs.release.outputs.version }}
          path: image-sbom.cdx.json
          retention-days: 365

      - name: Update Docker Hub description
        continue-on-error: true  # Cosmetic step; image publish already succeeded above. PATs without admin scope return Forbidden here.
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: asklokesh/loki-mode
          readme-filepath: ./docs/DOCKER.md
          short-description: "Autonomous spec-to-product system for Claude Code, Codex CLI, Cline, and Aider"

  # The VS Code marketplace publishing job was removed in v7.2.0. The
  # Loki Mode VSCode extension is deprecated and no longer maintained. The
  # marketplace listing remains for legacy users on v7.1.0 and earlier but
  # receives no further updates. The vscode-extension/ source remains in the
  # repo for users who want to build locally. See vscode-extension/README.md
  # for details.
