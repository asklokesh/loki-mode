name: Release

# MINIMAL RELEASE PIPELINE (founder directive 2026-10-19). This is the only
# publishing workflow in the repo (converge-dist-tags.yml only re-runs the
# dist-tag script every 15 min). A push to main that changes VERSION publishes every
# channel the product ships to, in parallel, with nothing in front of npm:
#   pack-npm -> publish-npm      npm loki-mode under latest AND next
#   release                      git tag vX.Y.Z + GitHub Release (CHANGELOG notes, skill zips, brew tarball)
#   update-homebrew              asklokesh/homebrew-tap formula (needs the release asset)
#   notify-slack                 release announcement
#   publish-ts-sdk               npm loki-mode-sdk under latest AND next
#   verify-sdk-registry          converges loki-mode-sdk dist-tags once the version resolves
#   publish-python-sdk           PyPI loki-mode-sdk
#   docker-build -> docker       Docker Hub asklokesh/loki-mode multi-arch, cosign keyless signature
#   sanity                       seconds-long syntax/version check; nothing depends on it
#   attach-sbom                  SPDX SBOMs (npm tarball, image) attached to the GitHub Release; provenance attested; all continue-on-error
# Tests, nightly, security audit and smoke workflows were deleted: run
# them locally (bash scripts/local-ci.sh). Every publish job is idempotent on
# rerun; npm is never unpublished (npm deprecate is allowed).

on:
  push:
    paths:
      - 'VERSION'
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_republish:
        description: 'Re-run the Homebrew and Slack jobs even if the GitHub release already exists'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # Fix-forward signal only: no job needs this one.
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bash syntax and version-file consistency
        run: |
          set -euo pipefail
          bash -n autonomy/run.sh
          bash -n autonomy/loki
          python3 -m py_compile dashboard/__init__.py mcp/__init__.py
          bash tests/test-server-json-current.sh
          bash tests/test-plugin-json-current.sh

  # The tarball is built ONCE here, with no secret and no write token.
  # publish-npm recomputes its sha256 and publishes exactly those bytes.
  pack-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tgz_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Bun
        # The npm prepack hook builds the loki-ts dist; without bun it falls
        # back to the committed dist.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          # Rule of Two: never restore a cache an issue-triggered job could have written.
          no-cache: true

      # The control-plane server bundle imports loki-ts source, so the loki-ts
      # deps (@anthropic-ai/sdk and others) must resolve during pack.
      - name: Install loki-ts dependencies
        run: bun install --cwd loki-ts --frozen-lockfile

      - name: Pack once and verify the PACKED tarball carries a fresh dist
        run: |
          # prepack rebuilds loki-ts/dist DURING pack and swallows a failed
          # build, so the checks run against the packed tarball, which is also
          # exactly what gets published.
          set -euo pipefail
          want="$(cat VERSION)"
          # `npm pack` skips prepublishOnly and `npm publish <tgz>` runs no
          # scripts, so build the web-app and control-plane dist here, fail closed.
          npm run prepublishOnly
          # `npm publish <tgz>` records no gitHead; stamp the release
          # commit into the packed manifest, then restore the tracked file.
          GITHEAD_STAMP="$(git rev-parse HEAD)" || { echo "FATAL: git rev-parse HEAD failed"; exit 1; }
          printf '%s' "$GITHEAD_STAMP" | grep -Eq '^[0-9a-f]{40}$' || { echo "FATAL: HEAD is not a 40-hex SHA: $GITHEAD_STAMP"; exit 1; }
          cp package.json "$RUNNER_TEMP/package.json.orig"
          npm pkg set gitHead="$GITHEAD_STAMP"
          tgz="$(npm pack --silent | tail -n 1)"
          cp "$RUNNER_TEMP/package.json.orig" package.json
          tar -xzOf "$tgz" package/package.json > "$RUNNER_TEMP/packed-package.json"
          PACKED_HEAD="$(node -p "require(process.argv[1]).gitHead || ''" "$RUNNER_TEMP/packed-package.json")"
          [ "$PACKED_HEAD" = "$GITHEAD_STAMP" ] || {
            echo "FATAL: packed package.json gitHead '${PACKED_HEAD}' != HEAD ${GITHEAD_STAMP}"; exit 1; }
          tar -tzf "$tgz" > "$RUNNER_TEMP/tgz.list"
          for need in package/packages/control-plane/dist/server.js \
                      package/packages/control-plane/dist/ask-tools-server.js \
                      package/packages/control-plane/ui/dist/index.html \
                      package/web-app/dist/index.html; do
            grep -qxF "$need" "$RUNNER_TEMP/tgz.list" || { echo "FATAL: packed tarball is missing $need"; exit 1; }
          done
          [ "$(node -p "require(process.argv[1]).version" "$RUNNER_TEMP/packed-package.json")" = "$want" ] || {
            echo "FATAL: packed package.json version != VERSION ${want}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/npm-tarball" "$RUNNER_TEMP/unpack"
          cp "$tgz" "$RUNNER_TEMP/npm-tarball/"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/unpack" package/loki-ts/dist/loki.js
          grep -q "\"${want}\"" "$RUNNER_TEMP/unpack/package/loki-ts/dist/loki.js" || {
            echo "FATAL: packed dist does not embed VERSION ${want}"; exit 1; }
          echo "OK: packed dist embeds ${want}, gitHead ${PACKED_HEAD}"

      - name: Record the tarball sha256
        id: digest
        run: |
          set -euo pipefail
          sha="$(sha256sum "$RUNNER_TEMP"/npm-tarball/*.tgz | cut -d' ' -f1)"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$' || { echo "FATAL: bad sha256 '$sha'"; exit 1; }
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload the tarball that is published
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarball
          overwrite: true
          path: ${{ runner.temp }}/npm-tarball/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Attest build provenance for the tarball
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/npm-tarball/*.tgz

      - name: Unpack the tarball for the SBOM scan
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom-src"
          tar -xzf "$RUNNER_TEMP"/npm-tarball/*.tgz -C "$RUNNER_TEMP/sbom-src"

      - name: Generate the npm SBOM (SPDX JSON)
        continue-on-error: true
        timeout-minutes: 3
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom-src
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-out/loki-mode-npm.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload the npm SBOM
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-npm
          overwrite: true
          path: ${{ runner.temp }}/sbom-out/loki-mode-npm.spdx.json
          if-no-files-found: error
          retention-days: 14

  # Depends ONLY on pack-npm. Publishes under next, then moves latest and next
  # only if VERSION is the highest (it re-reads instead of writing below a higher
          # tag). Idempotent on rerun.
  publish-npm:
    needs: pack-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-npm
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout (VERSION only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            VERSION
            scripts/npm-dist-tags.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download the packed tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm-tarball

      - name: Verify digest, publish under next, then move latest and next if highest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          WANT_SHA256: ${{ needs.pack-npm.outputs.tgz_sha256 }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          shopt -s nullglob
          tgzs=("$RUNNER_TEMP"/npm-tarball/*.tgz)
          [ "${#tgzs[@]}" = "1" ] || { echo "FATAL: expected exactly one tarball"; exit 1; }
          tgz="${tgzs[0]}"
          got="$(sha256sum "$tgz" | cut -d' ' -f1)"
          [ -n "$WANT_SHA256" ] && [ "$got" = "$WANT_SHA256" ] || {
            echo "FATAL: tarball sha256 ${got} != pack-npm digest '${WANT_SHA256}'"; exit 1; }
          if ! npm publish "$tgz" --access public --tag next; then
            # Rerun case: the version is already on the registry. Anything else is a real failure.
            if [ "$(npm view "loki-mode@${VERSION}" version --prefer-online 2>/dev/null || true)" = "$VERSION" ]; then
              echo "loki-mode@${VERSION} is already published; re-asserting dist-tags only if highest"
            else
              echo "FATAL: npm publish failed and loki-mode@${VERSION} is not on the registry"; exit 1
            fi
          fi
          # Highest-version guard, post-write re-read and overtaken-tag restore live in
          # scripts/npm-dist-tags.sh (FC-DIST-TAG-MOVED-BACKWARDS).
          # Best-effort only (FC-DIST-TAG-MOVED-BACKWARDS, RQ-102): the registry lags 4 to 11
          # min, so a short settle here fails every release. verify-npm-registry converges.
          if LOKI_DISTTAG_TRIES=2 bash scripts/npm-dist-tags.sh "$VERSION"; then
            echo "PUBLISHED loki-mode@${VERSION} latest+next" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::dist-tags not settled yet for loki-mode@${VERSION}; verify-npm-registry converges them"
            echo "PUBLISHED loki-mode@${VERSION} (tags converge in verify-npm-registry)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # FC-RELEASE-GREEN-WITHOUT-REGISTRY-PROOF: "+ loki-mode@X" in the publish log is
  # not proof; the registry served 11.50.0 about 11 minutes later. Own job with no
  # concurrency group, so it never holds the release-npm lock, and nothing needs it,
  # so docker, homebrew and release never wait on it. Red means the registry never
  # served the version.
  verify-npm-registry:
    needs: publish-npm
    # Converge dist-tags even when the publish job's tag step failed (RQ-102). !cancelled() so a
    # cancelled run stops this job too; skipped publish means nothing was uploaded.
    if: ${{ !cancelled() && needs.publish-npm.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout (VERSION and dist-tag script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            VERSION
            scripts/npm-dist-tags.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Prove the registry serves this version
        run: |
          set -uo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          for i in $(seq 1 90); do
            got="$(npm view "loki-mode@${VERSION}" version --prefer-online 2>/dev/null || true)"
            if [ "$got" = "$VERSION" ]; then
              echo "registry serves loki-mode@${VERSION} (poll $i)"; exit 0
            fi
            sleep 10
          done
          echo "::error::registry never served loki-mode@${VERSION} within about 15 minutes"
          exit 1

      # The registry applies a publish 3 to 6 minutes after the client prints
      # "+ loki-mode@X". A dist-tag write made inside publish-npm can be
      # overtaken by an earlier version materializing late, leaving latest
      # below the max (latest=11.54.1 next=11.54.2 at 04:41Z on 2026-10-23).
      # Converge again now that this version is served. The script only ever
      # moves tags to the max stable semver of its fresh reads and re-reads
      # instead of writing when a tag is already higher, so it is convergent and
      # safe to run outside the release-npm lock. npm has no compare-and-set, so
      # a window of milliseconds between its last read and a write remains.
      - name: Converge dist-tags after the version resolves
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # 50 tries x 15 s sleep is at least 12.5 min, covering the measured 4 to 11 min lag.
          LOKI_DISTTAG_TRIES: '50'
          LOKI_DISTTAG_SLEEP: '15'
        run: |
          set -uo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          bash scripts/npm-dist-tags.sh "$VERSION"

  # Tag and GitHub Release. Needs nothing, so it runs in parallel with npm.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_created: ${{ steps.check_release.outputs.release_exists == 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # notes are extracted BEFORE the tag, so a missing or half-written
      # CHANGELOG section aborts before anything irreversible happens.
      - name: Extract changelog for this version
        if: steps.check_release.outputs.release_exists == 'false'
        run: |
          set -uo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if ! bash scripts/release-notes.sh "$VERSION" > changelog_body.txt; then
            echo "ERROR: CHANGELOG.md has no fully-written release notes for v$VERSION." >&2
            echo "Add a '## v$VERSION' section with '### ' subsections and '- ' bullets before releasing." >&2
            exit 1
          fi

      - name: Create release artifacts
        if: steps.check_release.outputs.release_exists == 'false'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release/skill-root release/api-package/loki-mode release/loki-mode
          # loki-mode.zip and .skill (Claude.ai upload): SKILL.md at the root.
          cp SKILL.md release/skill-root/
          cp -r references release/skill-root/
          (cd release/skill-root && zip -qr "../loki-mode-${V}.zip" .)
          cp "release/loki-mode-${V}.zip" "release/loki-mode-${V}.skill"
          # loki-mode-api.zip (console.anthropic.com): SKILL.md inside loki-mode/.
          cp SKILL.md release/api-package/loki-mode/
          cp -r references release/api-package/loki-mode/
          (cd release/api-package && zip -qr "../loki-mode-api-${V}.zip" loki-mode)
          # loki-mode-claude-code (extract to ~/.claude/skills/).
          cp SKILL.md README.md VERSION CHANGELOG.md release/loki-mode/
          cp LICENSE release/loki-mode/ 2>/dev/null || true
          for d in references examples tests scripts autonomy dashboard memory skills providers \
                   events templates learning mcp completions integrations; do
            cp -r "$d" release/loki-mode/
          done
          (cd release && zip -qr "loki-mode-claude-code-${V}.zip" loki-mode && tar -czf "loki-mode-claude-code-${V}.tar.gz" loki-mode)
          # Brew source asset, attached at creation (releases are immutable).
          git archive --format=tar.gz --prefix="loki-mode-${V}/" -o "release/loki-mode-${V}.tar.gz" HEAD
          file "release/loki-mode-${V}.tar.gz" | grep -q 'gzip compressed' || { echo "ERROR: brew asset is not gzip"; exit 1; }

      # a tag already on the remote is reused only if it points at the
      # release SHA. Never --force, never delete a tag.
      - name: Create Git Tag
        if: steps.check_release.outputs.release_exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          TAG="v${VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}" "${RELEASE_SHA}" || exit 1
          if git push origin "refs/tags/${TAG}"; then
            echo "Pushed tag ${TAG} at ${RELEASE_SHA}."
            exit 0
          fi
          out="$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")" || out=""
          REMOTE_SHA="$(printf '%s\n' "$out" | awk -v p="refs/tags/${TAG}^{}" '$2==p{print $1}')"
          [ -n "$REMOTE_SHA" ] || REMOTE_SHA="$(printf '%s\n' "$out" | awk -v r="refs/tags/${TAG}" '$2==r{print $1}')"
          if [ "$REMOTE_SHA" = "$RELEASE_SHA" ]; then
            echo "Tag ${TAG} already on remote at release SHA ${RELEASE_SHA}; reusing it."
            exit 0
          fi
          if [ -n "$REMOTE_SHA" ]; then
            echo "ERROR: tag ${TAG} on remote points at ${REMOTE_SHA}, not the release SHA ${RELEASE_SHA}."
            echo "Refusing to release. Never force-move or delete a release tag; bump the version instead."
            exit 1
          fi
          echo "ERROR: pushing tag ${TAG} was rejected and the tag is not on the remote."
          echo "A release that changes .github/workflows/ needs the tag pushed with the maintainer's own credentials:"
          echo "  git tag -a ${TAG} -m 'Release ${TAG}' ${RELEASE_SHA} && git push origin refs/tags/${TAG}"
          exit 1

      - name: Create GitHub Release
        if: steps.check_release.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${V}" \
            "release/loki-mode-${V}.zip" \
            "release/loki-mode-${V}.skill" \
            "release/loki-mode-api-${V}.zip" \
            "release/loki-mode-${V}.tar.gz" \
            "release/loki-mode-claude-code-${V}.zip" \
            "release/loki-mode-claude-code-${V}.tar.gz" \
            --title "Loki Mode v${V}" \
            --notes-file changelog_body.txt

      - name: Skip message
        if: steps.check_release.outputs.release_exists == 'true'
        run: echo "Release v${{ steps.version.outputs.version }} already exists. Skipping."

  # Hashes the release's brew asset, so it runs after the GitHub Release.
  update-homebrew:
    needs: release
    if: needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Render and push the Homebrew formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          ASSET="loki-mode-${VERSION}.tar.gz"
          gh release download "v${VERSION}" --repo asklokesh/loki-mode --pattern "${ASSET}" --dir "$RUNNER_TEMP" --clobber
          file "${RUNNER_TEMP}/${ASSET}" | grep -q 'gzip compressed' || { echo "ERROR: asset is not a gzip tarball"; exit 1; }
          SHA256=$(sha256sum "${RUNNER_TEMP}/${ASSET}" | cut -d' ' -f1)
          cat > "${RUNNER_TEMP}/loki-mode.rb.tpl" << 'FORMULA_EOF'
          class LokiMode < Formula
            desc "Autonomous coding agent platform CLI for Claude Code, Codex CLI, Cline, and Aider"
            homepage "https://github.com/asklokesh/loki-mode"
            url "https://github.com/asklokesh/loki-mode/releases/download/vVERSION_PLACEHOLDER/loki-mode-VERSION_PLACEHOLDER.tar.gz"
            sha256 "SHA256_PLACEHOLDER"
            license "BUSL-1.1"

            depends_on "node"
            depends_on "oven-sh/bun/bun"

            def install
              libexec.install Dir["*"]
              # bin/loki is the Bun-aware shim (v7.4.2 BUG-4); link it, not autonomy/loki.
              bin.install_symlink libexec/"bin/loki" => "loki"
            end

            test do
              system "#{bin}/loki", "--version"
            end
          end
          FORMULA_EOF
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g; s/SHA256_PLACEHOLDER/${SHA256}/g" "${RUNNER_TEMP}/loki-mode.rb.tpl" > "${RUNNER_TEMP}/loki-mode.rb"
          grep -q "sha256 \"${SHA256}\"" "${RUNNER_TEMP}/loki-mode.rb" || { echo "FATAL: formula render failed"; exit 1; }
          CURRENT_SHA=$(gh api repos/asklokesh/homebrew-tap/contents/Formula/loki-mode.rb --jq '.sha')
          CONTENT=$(base64 < "${RUNNER_TEMP}/loki-mode.rb" | tr -d '\n')
          gh api repos/asklokesh/homebrew-tap/contents/Formula/loki-mode.rb \
            -X PUT \
            -f message="Update to v${VERSION}" \
            -f content="$CONTENT" \
            -f sha="$CURRENT_SHA"
          echo "Homebrew formula updated to v${VERSION}"

  notify-slack:
    needs: release
    if: needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_republish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION_FOR_SLACK: v${{ needs.release.outputs.version }}
          RELEASE_URL_FOR_SLACK: https://github.com/asklokesh/loki-mode/releases/tag/v${{ needs.release.outputs.version }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping Slack notification"
            exit 0
          fi
          if ! bash scripts/release-notes.sh "${VERSION_FOR_SLACK#v}" > "$RUNNER_TEMP/changelog-body.txt"; then
            echo "Release ${VERSION_FOR_SLACK}" > "$RUNNER_TEMP/changelog-body.txt"
          fi
          python3 - "$RUNNER_TEMP/changelog-body.txt" "$RUNNER_TEMP/slack-payload.json" <<'PY'
          import json, os, sys
          version = os.environ['VERSION_FOR_SLACK']
          release_url = os.environ['RELEASE_URL_FOR_SLACK']
          changelog = open(sys.argv[1]).read().strip()
          if len(changelog) > 1500:
              changelog = changelog[:1500] + '...'
          ask = ('*Ready for website update.* Reply in this thread:\n>`@Claude update the autonomi.dev blog for Loki Mode '
                 f'{version}. Read the changelog from https://github.com/asklokesh/loki-mode/blob/main/CHANGELOG.md for {version}, '
                 'then update src/data/blog-posts.ts in https://github.com/asklokesh/autonomi-website with a new blog post entry. '
                 'Also update the FALLBACK version in src/hooks/useLatestVersion.ts. No emojis. Commit and push.`')
          payload = {'blocks': [
              {'type': 'header', 'text': {'type': 'plain_text', 'text': f'Loki Mode {version} Released'}},
              {'type': 'section', 'text': {'type': 'mrkdwn', 'text': f'*<{release_url}|View Release on GitHub>*'}},
              {'type': 'section', 'text': {'type': 'mrkdwn', 'text': changelog}},
              {'type': 'divider'},
              {'type': 'section', 'text': {'type': 'mrkdwn', 'text': ask}},
          ]}
          json.dump(payload, open(sys.argv[2], 'w'))
          PY
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' -d @"$RUNNER_TEMP/slack-payload.json"
          echo "Slack notification sent for ${VERSION_FOR_SLACK}"

  # Idempotent (--skip-existing), so it needs nothing and starts at t=0.
  publish-python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Build and publish to PyPI
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < ../../VERSION)"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          pip install build twine
          python -m build
          twine upload --skip-existing dist/*

  # Idempotent, so it needs nothing and starts at t=0.
  publish-ts-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-npm-sdk
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and publish loki-mode-sdk under next, then latest and next if highest
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < ../../VERSION)"
          npm pkg set version="$VERSION"
          npm install
          npm run build
          if ! npm publish --access public --tag next; then
            if [ "$(npm view "loki-mode-sdk@${VERSION}" version --prefer-online 2>/dev/null || true)" != "$VERSION" ]; then
              echo "FATAL: sdk publish failed and loki-mode-sdk@${VERSION} is not on the registry"; exit 1
            fi
            echo "loki-mode-sdk@${VERSION} already published"
          fi
          # Same highest-version guard, fail-closed reads and overtaken-tag restore as
          # loki-mode (FC-DIST-TAG-MOVED-BACKWARDS).
          # Best-effort only (RQ-102); verify-sdk-registry converges.
          if ! LOKI_DISTTAG_TRIES=2 LOKI_DISTTAG_PKG=loki-mode-sdk bash ../../scripts/npm-dist-tags.sh "$VERSION"; then
            echo "::warning::sdk dist-tags not settled yet for loki-mode-sdk@${VERSION}; verify-sdk-registry converges them"
          fi

  # Same late-materialization converge as verify-npm-registry, for loki-mode-sdk
  # (FC-DIST-TAG-MOVED-BACKWARDS). Nothing waits on it and it holds no lock: the
  # script moves tags to the max stable semver of its reads and re-reads instead
  # of writing when a tag is already higher; npm has no compare-and-set, so a
  # window of milliseconds remains.
  verify-sdk-registry:
    needs: publish-ts-sdk
    # Converge dist-tags even when the publish job's tag step failed (RQ-102). !cancelled() so a
    # cancelled run stops this job too; skipped publish means nothing was uploaded.
    if: ${{ !cancelled() && needs.publish-ts-sdk.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout (VERSION and dist-tag script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            VERSION
            scripts/npm-dist-tags.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Prove the registry serves this SDK version
        run: |
          set -uo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          for i in $(seq 1 90); do
            got="$(npm view "loki-mode-sdk@${VERSION}" version --prefer-online 2>/dev/null || true)"
            if [ "$got" = "$VERSION" ]; then
              echo "registry serves loki-mode-sdk@${VERSION} (poll $i)"; exit 0
            fi
            sleep 10
          done
          echo "::error::registry never served loki-mode-sdk@${VERSION} within about 15 minutes"
          exit 1

      - name: Converge SDK dist-tags after the version resolves
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LOKI_DISTTAG_PKG: loki-mode-sdk
          LOKI_DISTTAG_TRIES: '50'
          LOKI_DISTTAG_SLEEP: '15'
        run: |
          set -uo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          bash scripts/npm-dist-tags.sh "$VERSION"

  # Native per-arch build (no QEMU), pushed by digest; needs nothing, so it
  # starts at t=0. The docker job assembles the multi-arch manifest.
  docker-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun (for loki-ts build before docker context)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          # Rule of Two: this job holds a Docker Hub publish secret, so it
          # never restores a cache an issue-triggered job could have written.
          no-cache: true

      - name: Build loki-ts dist (Dockerfile COPY needs loki-ts/dist/loki.js)
        working-directory: loki-ts
        run: |
          set -euo pipefail
          bun install --production
          bun run build
          test -f dist/loki.js || { echo "FATAL: loki-ts/dist/loki.js not built"; exit 1; }

      - name: Set up Docker Buildx (native, no QEMU)
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Rule of Two: never restore a cache an issue-triggered job could have written.
          cache-binary: false

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.platform }}, native)
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=asklokesh/loki-mode,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST" || { echo "FATAL: build step produced no digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token: write mints the OIDC token for cosign KEYLESS signing.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout (VERSION only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          cache-binary: false

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        id: build
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          sources=()
          for d in "$RUNNER_TEMP"/digests/*; do sources+=("asklokesh/loki-mode@sha256:$(basename "$d")"); done
          test "${#sources[@]}" -ge 2 || { echo "FATAL: expected 2 per-arch digests, found ${#sources[@]}"; exit 1; }
          docker buildx imagetools create \
            -t "asklokesh/loki-mode:v${VERSION}" \
            -t "asklokesh/loki-mode:${VERSION}" \
            -t "asklokesh/loki-mode:latest" \
            "${sources[@]}"
          digest="sha256:$(docker buildx imagetools inspect "asklokesh/loki-mode:v${VERSION}" --raw | sha256sum | cut -d' ' -f1)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Sign the manifest-list DIGEST (tags are mutable), in the same job that
      # pushed it: if the image published, the signature ran.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign the image digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST" || { echo "FATAL: manifest step produced no digest"; exit 1; }
          cosign sign --yes "asklokesh/loki-mode@${DIGEST}"

      - name: Attest build provenance for the image digest
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/asklokesh/loki-mode
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Generate the image SBOM (SPDX JSON)
        continue-on-error: true
        timeout-minutes: 3
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: asklokesh/loki-mode@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-out/loki-mode-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload the image SBOM
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-image
          overwrite: true
          path: ${{ runner.temp }}/sbom-out/loki-mode-image.spdx.json
          if-no-files-found: error
          retention-days: 14

  # Additive: nothing depends on this job and it never fails the run.
  attach-sbom:
    needs: [release, pack-npm, docker]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout (VERSION only)
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the SBOMs
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/sbom
          pattern: sbom-*
          merge-multiple: true

      - name: Attach the SBOMs to the GitHub release
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\n' < VERSION)"
          gh release upload "v${VERSION}" "$RUNNER_TEMP"/sbom/*.spdx.json --clobber
