name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip on fork PRs: GitHub does not expose secrets (CLAUDE_CODE_OAUTH_TOKEN,
    # ANTHROPIC_API_KEY) or OIDC tokens to workflows triggered from forks, so the
    # action would always fail with `Unable to get ACTIONS_ID_TOKEN_REQUEST_URL`.
    # External contributors saw a perpetually-red check they could not fix; gate
    # to non-fork PRs only. Internal PRs still get the AI review.
    if: github.event.pull_request.head.repo.fork == false

    runs-on: ubuntu-latest
    # Rule of Two: the reviewer is an agent, so it gets a token that can comment
    # and cannot push. No id-token: without it the action cannot exchange OIDC
    # for its GitHub App token (which can write contents); it uses github_token
    # below, scoped by these permissions.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Only the diff and the comment it posts: no tool that reads other
          # people's issue or PR comments, which are untrusted text.
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr comment:*)"'

