name: PR fast tier

on:
  pull_request:
  # Signal only: publish never waits on this run (no release.yml job needs it).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - name: Install loki-ts dependencies
        run: bun install --cwd loki-ts --frozen-lockfile

      # local-ci runs `python3.12 -m pytest`; the runner's system python3.12 has no pytest
      # (run 41188540211: "/usr/bin/python3.12: No module named pytest"). Same install as
      # the retired test.yml python jobs: requirements-test.txt is the repo's test dependency list.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Fast tier of local-ci
        env:
          LOCAL_CI_TIER: fast
        run: bash scripts/local-ci.sh
