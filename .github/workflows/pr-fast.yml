name: PR fast tier

on:
  pull_request:
  # Signal only: publish never waits on this run (no release.yml job needs it).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - name: Install loki-ts dependencies
        run: bun install --cwd loki-ts --frozen-lockfile

      - name: Fast tier of local-ci
        env:
          LOCAL_CI_TIER: fast
          LOCAL_CI_BUN_OFFLOADED: '1'
        run: bash scripts/local-ci.sh

  # The serial bun test (400 files) outgrew the fast-tier job's 15 minutes, so it runs
  # as shards here. No tail: output streams, so a hang names its file in the log.
  bun-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - name: Install loki-ts dependencies
        run: bun install --cwd loki-ts --frozen-lockfile

      # control.test.ts, control_default.test.ts and council/finding_schema.test.ts import
      # packages/control-plane, which resolves drizzle-orm from its own node_modules.
      - name: Install control-plane dependencies
        run: bun install --cwd packages/control-plane --frozen-lockfile

      - name: bun test shard ${{ matrix.shard }}
        run: cd loki-ts && bun run test --shard=${{ matrix.shard }}
