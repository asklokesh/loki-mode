name: PR fast tier

on:
  pull_request:
  # Signal only: publish never waits on this run (no release.yml job needs it).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false  # setup-node v5+ caches npm automatically; a cache an issue-triggered job can write must never reach a job holding secrets
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # dist-freshness rebuilds loki-ts from source and engine10-e2e-stub runs the
      # committed bundle; the receipt test needs `cryptography` for the JWKS cases
      # (it reports a skip, never a pass, without it).
      - name: Install dependencies
        run: |
          bun install --cwd loki-ts --frozen-lockfile
          python3 -m pip install cryptography

      # The whole gate: the hermetic tests under tests/min/ (syntax, CLI smoke,
      # engine end to end on the stub provider, receipts, release and
      # packaging checks, quality-gate scripts, hygiene).
      - name: Run scripts/local-ci.sh
        run: bash scripts/local-ci.sh
