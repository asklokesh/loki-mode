name: First-run gate

# NON-required: informational until A-01 promote consumes it. Stub provider, no keys.
# Expected to fail while the first-run defects (docs/v10/FIRST-RUN-GATE.md) are open.

on:
  push:
    branches: [main, "train/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # E-162: train/** pushes share one group per ref, so a newer train push
  # cancels a superseded train's in-progress run. main keeps a per-SHA
  # group and is never cancelled (Tier B / release verdict).
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/train/')) && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/train/') }}

jobs:
  # E-160 / D55: a main push of a SHA a train/** run already verified green
  # reuses that verdict. Any doubt gives reuse=false and the jobs below run.
  train-reuse:
    name: Train verdict reuse
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - name: Checkout (scripts/ci only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Reuse a train run's verdict for this exact SHA
        id: reuse
        continue-on-error: true
        env:
          WF_FILE: first-run-gate.yml
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          LOKI_E160_REUSE: ${{ vars.LOKI_E160_REUSE }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/train-verdict-reuse.sh gate

  first-run-gate:
    name: first-run gate (stub)
    needs: [train-reuse]
    if: ${{ !cancelled() && needs.train-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - name: Run the gate
        env:
          FRG_REPORT: ${{ runner.temp }}/first-run-gate-report.txt
        run: bash scripts/first-run-gate.sh --stub

      - name: Upload per-assertion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run-gate-report
          path: ${{ runner.temp }}/first-run-gate-report.txt
          if-no-files-found: warn
