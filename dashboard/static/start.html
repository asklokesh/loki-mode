<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loki Mode - Get started</title>
<style>
:root{--bg:#fafafa;--fg:#1a1a24;--mut:#6b6b7a;--card:#fff;--bd:#dcdce4;--acc:#553DE9;--ok:#1a7f37;--bad:#c62828;--warn:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#14141b;--fg:#ececf3;--mut:#9a9aab;--card:#1d1d27;--bd:#33333f;--acc:#8b78ff;--ok:#4ac26b;--bad:#ff6b6b;--warn:#e3b341}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;margin:16px 0}
.card.off{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
input,select{padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);min-width:220px}
button{padding:8px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
.tag{display:inline-block;padding:0 6px;border:1px solid var(--bd);border-radius:10px;font-size:12px;margin-right:4px}
.st{font-weight:600}.st.blocked,.st.failed{color:var(--bad)}.st.pr_open,.st.done{color:var(--ok)}.st.running{color:var(--acc)}.st.queued{color:var(--warn)}
</style>
</head>
<body>
<main>
<h1>Loki Mode</h1>
<p class="mut">Connect once, then complete your backlog. Each issue gets its own worktree, branch and PR.</p>

<section class="card" id="s1"><h2>1. Provider</h2>
<div id="s1-state" class="mut">Checking...</div>
<div class="row"><select id="prov"><option value="claude">claude</option><option value="codex">codex</option></select>
<input id="key" type="password" autocomplete="off" placeholder="API key (optional if the CLI is logged in)">
<button id="s1-go">Use provider</button></div><div id="s1-msg"></div></section>

<section class="card off" id="s2"><h2>2. GitHub</h2>
<div id="s2-state" class="mut">Not connected</div>
<div class="row"><input id="pat" type="password" autocomplete="off" placeholder="Personal access token (repo scope)">
<button id="s2-go">Connect</button></div>
<div class="mut">Stored on this machine only (mode 0600). It is never shown again.</div><div id="s2-msg"></div></section>

<section class="card off" id="s3"><h2>3. Repository</h2>
<div class="row"><select id="repos"></select><input id="repo" placeholder="or type owner/repo">
<button id="s3-go">Choose</button></div><div id="s3-msg"></div></section>

<section class="card off" id="s4"><h2>Backlog <span id="bl-repo" class="mut"></span></h2>
<div class="row"><button id="sel">Complete selected</button><button id="all">Complete all</button>
<button class="sec" id="refresh">Refresh</button><span class="mut" id="conc"></span></div>
<table><thead><tr><th></th><th>#</th><th>Issue</th><th>Size</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>
<div id="bl-msg"></div></section>
<section class="card" id="ws"><h2>Workspace runs</h2>
<div id="ws-body" class="mut">Loading...</div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const api=async(m,p,b)=>{const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));return j};
const say=(id,t,bad)=>{$(id).textContent=t;$(id).className=bad?'bad':'ok'};
const el=(t,txt,cls)=>{const e=document.createElement(t);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e};
let issues=[],status={};
async function state(){
  const s=await api('GET','/api/onboarding/state');
  $('s1-state').textContent=s.provider.configured?('Using '+s.provider.name):
    (s.provider.detected.length?'Detected: '+s.provider.detected.map(d=>d.name+' '+d.version).join(', '):'No claude or codex CLI found; enter an API key.');
  if(s.provider.detected.length&&!s.provider.configured)$('prov').value=s.provider.detected[0].name;
  $('s2').classList.toggle('off',!s.provider.configured);
  $('s2-state').textContent=s.github.configured?('Connected as '+s.github.login):'Not connected';
  $('s3').classList.toggle('off',!s.github.configured);
  if(s.github.configured&&!$('repos').options.length){try{const r=await api('GET','/api/onboarding/repos');
    r.repos.forEach(x=>$('repos').appendChild(el('option',x)))}catch(e){say('s3-msg',e.message,1)}}
  $('s4').classList.toggle('off',!s.repo);
  if(s.repo){$('bl-repo').textContent=s.repo;if(!issues.length)await loadIssues()}
}
async function loadIssues(){try{issues=(await api('GET','/api/backlog/issues')).issues;render()}catch(e){say('bl-msg',e.message,1)}}
function render(){
  const tb=$('rows');tb.replaceChildren();
  issues.forEach(i=>{const st=status[i.number]||{};const tr=el('tr');
    const cb=el('input');cb.type='checkbox';cb.dataset.n=i.number;cb.style.minWidth='0';tr.appendChild(el('td')).appendChild(cb);
    tr.appendChild(el('td','#'+i.number));
    const td=el('td');const a=el('a',i.title);a.href=i.url||'#';a.target='_blank';a.rel='noopener';td.appendChild(a);
    i.labels.forEach(l=>td.appendChild(el('span',l,'tag')));tr.appendChild(td);
    tr.appendChild(el('td',i.size));
    const sc=el('td');sc.appendChild(el('span',st.status||'-','st '+(st.status||'')));
    if(st.pr_url){sc.appendChild(document.createTextNode(' '));const p=el('a','PR');p.href=st.pr_url;p.target='_blank';p.rel='noopener';sc.appendChild(p)}
    if(st.question)sc.appendChild(el('div','Question: '+st.question,'mut'));
    if(st.resume_hint)sc.appendChild(el('div',st.resume_hint,'mut'));
    if(st.detail)sc.appendChild(el('div',st.detail,'mut'));
    tr.appendChild(sc);tb.appendChild(tr)})}
async function poll(){try{const s=await api('GET','/api/backlog/status');status={};s.issues.forEach(i=>status[i.number]=i);
  $('conc').textContent='concurrency '+s.concurrency;if(issues.length)render()}catch(e){}}
async function loadWorkspaceRuns(){
  const b=$('ws-body');
  let r;
  try{r=await api('GET','/api/operator/workspaces/runs')}
  catch(e){b.replaceChildren(el('div','Could not load workspace runs: '+e.message,'bad'));return}
  const runs=Array.isArray(r&&r.runs)?r.runs:null;
  if(!runs){b.replaceChildren(el('div','Could not load workspace runs: unexpected response','bad'));return}
  if(!runs.length){b.replaceChildren(el('div','No runs'+(r.reason?' ('+r.reason+')':''),'mut'));return}
  const t=el('table');
  t.appendChild(el('thead')).appendChild(el('tr')).append(el('th','Run'),el('th','Repo'),el('th','Status'),el('th','Freshness'));
  const tb=el('tbody');
  runs.forEach(run=>{
    const id=(run.workspace||'?')+'/'+(run.run_id||'?');
    if(run.state==='unreadable'){
      const tr=el('tr');tr.appendChild(el('td',id));
      const td=el('td','Unreadable run: '+(run.error||'unknown error'),'bad');td.colSpan=3;tr.appendChild(td);tb.appendChild(tr);return}
    const oc=run.outcomes&&typeof run.outcomes==='object'?run.outcomes:{};
    (run.repos||[]).forEach(rp=>{
      const rs=oc[rp.repo]==null?'':String(oc[rp.repo]);
      const tr=el('tr');tr.appendChild(el('td',id));tr.appendChild(el('td',rp.repo||'?'));
      tr.appendChild(el('td',rs||'-','st '+(rs.startsWith('ok')?'ok':rs?'bad':'')));
      const f=el('td');
      if(rp.stale===true)f.appendChild(el('span','stale','tag bad'));
      else if(rp.stale==null&&rp.reason)f.appendChild(el('span',rp.reason,'mut'));
      tr.appendChild(f);tb.appendChild(tr)});
    const ig=run.status==null?'':String(run.status);
    const tr=el('tr');tr.appendChild(el('td',id));tr.appendChild(el('td','integration','mut'));
    const sc=el('td');sc.appendChild(el('span',ig||'-','st '+(ig||'')));tr.appendChild(sc);tr.appendChild(el('td'));tb.appendChild(tr)});
  t.appendChild(tb);b.replaceChildren(t)}
async function go(btn,msg,fn){btn.disabled=true;try{await fn();say(msg,'Done')}catch(e){say(msg,e.message,1)}btn.disabled=false;await state()}
$('s1-go').onclick=e=>go(e.target,'s1-msg',async()=>{await api('POST','/api/onboarding/provider',{provider:$('prov').value,api_key:$('key').value||null});$('key').value=''});
$('s2-go').onclick=e=>go(e.target,'s2-msg',async()=>{await api('POST','/api/onboarding/github',{token:$('pat').value});$('pat').value=''});
$('s3-go').onclick=e=>go(e.target,'s3-msg',async()=>{await api('POST','/api/onboarding/repo',{repo:$('repo').value||$('repos').value});issues=[]});
$('sel').onclick=e=>go(e.target,'bl-msg',async()=>{const n=[...document.querySelectorAll('#rows input:checked')].map(c=>+c.dataset.n);
  if(!n.length)throw new Error('Select at least one issue');await api('POST','/api/backlog/run',{issues:n});await poll()});
$('all').onclick=e=>go(e.target,'bl-msg',async()=>{await api('POST','/api/backlog/run',{all:true});await poll()});
$('refresh').onclick=loadIssues;
state();loadWorkspaceRuns();setInterval(poll,3000);
</script>
</body>
</html>
