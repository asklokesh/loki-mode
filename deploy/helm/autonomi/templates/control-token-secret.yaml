{{- /*
Chart-owned Control Plane token Secret for the existingSecret case. The user's
Secret may not hold the token key, so the chart keeps its own. Set
secrets.controlTokenFromExistingSecret=true to read the key from existingSecret
instead (it then MUST contain secrets.controlTokenKey).
*/}}
{{- if and .Values.secrets.existingSecret (not .Values.secrets.controlTokenFromExistingSecret) }}
{{- $tokenKey := .Values.secrets.controlTokenKey | default "LOKI_CONTROL_TOKEN" }}
{{- $name := include "autonomi.controlTokenSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := .Values.secrets.controlToken }}
{{- if and (not $token) $existing $existing.data }}
{{- $prev := get $existing.data $tokenKey }}
{{- if $prev }}{{ $token = $prev | b64dec }}{{ end }}
{{- end }}
{{- if not $token }}{{ $token = randAlphaNum 32 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "autonomi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $tokenKey }}: {{ $token | b64enc | quote }}
{{- end }}
