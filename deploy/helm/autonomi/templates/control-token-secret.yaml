{{- /*
Chart-owned Control Plane token Secret, rendered in every mode so the token has
one home (<fullname>-control-token) whether or not existingSecret is used. The
Control Plane refuses to bind 0.0.0.0 without a token. Set
secrets.controlTokenFromExistingSecret=true to read the key from existingSecret
instead (it then MUST contain secrets.controlTokenKey) and skip this Secret.
Stable across upgrades: the token is looked up in this Secret first, then in the
legacy location (the main release Secret, where earlier chart versions kept it).
*/}}
{{- if not (and .Values.secrets.existingSecret .Values.secrets.controlTokenFromExistingSecret) }}
{{- $tokenKey := .Values.secrets.controlTokenKey | default "LOKI_CONTROL_TOKEN" }}
{{- $name := include "autonomi.controlTokenSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := .Values.secrets.controlToken }}
{{- if and (not $token) $existing $existing.data }}
{{- $prev := get $existing.data $tokenKey }}
{{- if $prev }}{{ $token = $prev | b64dec }}{{ end }}
{{- end }}
{{- if and (not $token) (not .Values.secrets.existingSecret) }}
{{- $legacy := lookup "v1" "Secret" .Release.Namespace (include "autonomi.fullname" .) }}
{{- if and $legacy $legacy.data }}
{{- $prev := get $legacy.data $tokenKey }}
{{- if $prev }}{{ $token = $prev | b64dec }}{{ end }}
{{- end }}
{{- end }}
{{- if not $token }}{{ $token = randAlphaNum 32 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "autonomi.labels" . | nindent 4 }}
  annotations:
    # Helm: survive uninstall. Argo CD needs its own opt-out to survive a prune.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data:
  {{ $tokenKey }}: {{ $token | b64enc | quote }}
{{- end }}
