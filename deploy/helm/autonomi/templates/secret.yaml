{{- if not .Values.secrets.existingSecret }}
{{- $tokenKey := .Values.secrets.controlTokenKey | default "LOKI_CONTROL_TOKEN" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "autonomi.fullname" .) }}
{{- $token := .Values.secrets.controlToken }}
{{- if and (not $token) $existing $existing.data }}
{{- $prev := get $existing.data $tokenKey }}
{{- if $prev }}{{ $token = $prev | b64dec }}{{ end }}
{{- end }}
{{- if not $token }}{{ $token = randAlphaNum 32 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autonomi.fullname" . }}
  labels:
    {{- include "autonomi.labels" . | nindent 4 }}
  annotations:
    # Keep the token across uninstall and GitOps prune so clients do not rotate.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Always present: the Control Plane refuses to bind 0.0.0.0 without a token.
  # Kept stable across upgrades via lookup of the existing Secret.
  {{ $tokenKey }}: {{ $token | b64enc | quote }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.googleApiKey }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.slackBotToken }}
  LOKI_SLACK_BOT_TOKEN: {{ .Values.secrets.slackBotToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.githubToken }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | b64enc | quote }}
  {{- end }}
{{- end }}
